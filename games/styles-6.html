document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>navigate(b.dataset.page));
function show(next){page=next;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===next||(b.dataset.page==='setup'&&['quiz','result'].includes(next))));if(next==='home')home();if(next==='theory')theory();if(next==='setup')setup();if(next==='quiz')quiz();if(next==='result')results();window.scrollTo({top:0});}
function home(){const b=best();app.innerHTML=`<section class="hero"><div><div class="eyebrow">Лаборатория русского языка</div><h1>Одна мысль.<br>Пять стилей.</h1><p class="muted">Научись замечать, как меняется речь — от беседы с другом до страницы учебника.</p><div class="actions"><button class="btn" id="start">Начать тренировку <span>↗</span></button><button class="btn secondary" id="learn">Сначала памятка</button></div><p class="hero-foot"><span>15 заданий</span><span>≈ 10 минут</span><span>6 класс</span></p></div><div class="visual" aria-label="Примеры одной темы в разных стилях"><div class="visual-title">ВСЁ ДЕЛО В ТОМ, КАК СКАЗАТЬ</div><div class="bubble"><small>Разговорный</small>Ну и дождик! Промок до нитки.</div><div class="bubble"><small>Научный</small>Дождь — жидкие атмосферные осадки.</div><div class="bubble"><small>Художественный</small>Дождь заиграл на крышах тихую мелодию.</div></div></section><section><div class="section-title"><h2>У каждой речи — своя задача</h2><span class="pill">5 стилей речи</span></div><div class="style-grid">${styles.map((s,i)=>`<button class="style-card" data-style="${i}"><span class="icon" aria-hidden="true">${s.icon}</span><h3>${s.name}</h3><p>${s.tag} <span aria-hidden="true">↗</span></p></button>`).join('')}</div><div class="bottom-note"><b>Секрет распознавания</b><p>Спроси себя: <strong>зачем</strong> создан текст, <strong>кому</strong> он адресован и <strong>какие слова</strong> в нём используются. Стиль речи и тип речи — разные понятия.</p></div>${b?`<p class="muted">Твой лучший результат в проверочной работе: <strong>${b.score} из 15</strong>.</p>`:''}</section>`;$('#start').onclick=()=>{show('setup');$('#name').focus()};$('#learn').onclick=()=>show('theory');document.querySelectorAll('[data-style]').forEach(b=>b.onclick=()=>{styleIndex=Number(b.dataset.style);show('theory')})}
function theory(){let s=styles[styleIndex];app.innerHTML=`<div class="eyebrow">Памятка</div><h2 style="margin-top:12px">Пять способов говорить о мире</h2><p class="muted">Выбери стиль и посмотри, как его узнать.</p><div class="theory-layout"><aside class="style-menu" aria-label="Стили речи">${styles.map((s,i)=>`<button class="${i===styleIndex?'active':''}" data-style="${i}" aria-pressed="${i===styleIndex}">${s.name}</button>`).join('')}</aside><article class="panel"><span class="eyebrow">${s.tag}</span><h2 style="margin-top:12px">${s.name} стиль</h2><div class="detail-grid"><div><span class="label">Зачем</span>${s.purpose}</div><div><span class="label">Где встречается</span>${s.where}</div></div><span class="label">Как узнать</span><p>${s.features}</p><span class="label">Пример</span><blockquote>${s.example}</blockquote><div class="tip">${s.note}</div><div class="actions"><button class="btn" id="practice">Попробовать в деле ↗</button></div></article></div><div class="bottom-note"><b>Не путай!</b><p><strong>Стиль речи</strong> зависит от цели и ситуации общения. <strong>Тип речи</strong> — это повествование, описание или рассуждение. Например, описание бывает и научным, и художественным.</p></div>`;document.querySelectorAll('[data-style]').forEach(b=>b.onclick=()=>{styleIndex=+b.dataset.style;theory()});$('#practice').onclick=()=>show('setup')}
function setup(){app.innerHTML=`<div class="quiz-wrap"><div class="eyebrow">Практика</div><h2 style="margin-top:12px">От теории — к уверенности</h2><p class="muted">Определи стиль по тексту, ситуации и языковым признакам.</p><div class="form-row"><label class="field">Имя ученика (необязательно) <input id="name" autocomplete="name" maxlength="80" placeholder="Например, Маша Иванова"></label><label class="field">Класс или группа <input id="group" maxlength="30" placeholder="Например, 6Б"></label></div><p class="muted" style="font-size:13px">Имя вводить необязательно. Ответы проверяются на этом устройстве. Отчёт можно сохранить в файл.</p><p id="form-error" class="error" role="alert"></p><div class="mode-cards"><article class="mode-card"><span class="eyebrow">Учимся без спешки</span><h2 style="margin-top:14px">Тренировка</h2><span class="num">15 заданий</span><p class="muted">Подсказки и объяснение после каждого ответа. Можно сразу разобраться в ошибке.</p><button class="btn" id="train">Тренироваться ↗</button></article><article class="mode-card dark"><span class="eyebrow" style="color:var(--lime)">Проверяем себя</span><h2 style="margin-top:14px">Проверочная работа</h2><span class="num">15 заданий</span><p class="muted">Без подсказок. Все ответы и объяснения увидишь в конце. Итоговый отчёт — для учителя.</p><button class="btn light" id="exam">Начать проверку ↗</button></article></div></div>`;$('#train').onclick=()=>start('train');$('#exam').onclick=()=>start('exam')}
function start(mode,qs=null){const name=$('#name')?.value.trim()||session?.name||'Ученик',group=$('#group')?.value.trim()||session?.group||'';session={mode,name,group,qs:shuffle(qs||questions),index:0,answers:[],selected:null,checked:false,started:Date.now(),attemptId:globalThis.crypto?.randomUUID?.()||String(Date.now())};sendState='offline';show('quiz')}
function quiz(){let s=session,q=s.qs[s.index];app.innerHTML=`<div class="quiz-wrap"><div class="topline"><span class="eyebrow">${s.mode==='exam'?'Проверочная работа':s.mode==='retry'?'Работа над ошибками':'Тренировка'}</span><span class="muted">Задание ${s.index+1} из ${s.qs.length}</span></div><div class="progress" role="progressbar" aria-label="Прогресс" aria-valuemin="0" aria-valuemax="${s.qs.length}" aria-valuenow="${s.index}"><div style="width:${s.index/s.qs.length*100}%"></div></div><article class="panel"><span class="label">${q.kind}</span><h2>${q.prompt}</h2><div class="question-text">${esc(q.text)}</div><div class="options" role="group" aria-label="Варианты ответа">${styles.map((style,i)=>`<button class="option ${s.selected===i?'selected':''} ${s.checked&&s.mode!=='exam'?(i===q.answer?'correct':s.selected===i?'wrong':''):''}" data-choice="${i}" aria-pressed="${s.selected===i}" ${s.checked?'disabled':''}><span>${i+1}</span>${style.name}${s.checked&&s.mode!=='exam'&&i===q.answer?' ✓':''}</button>`).join('')}</div><div id="feedback" aria-live="polite">${s.checked&&s.mode!=='exam'?`<div class="feedback ${s.selected===q.answer?'':'wrong'}"><strong>${s.selected===q.answer?'Верно!':'Разберёмся вместе'}</strong><p>${s.selected===q.answer?'':'Правильный ответ: '+styles[q.answer].name+'. '}${q.explain}</p></div>`:''}</div>${s.mode!=='exam'&&!s.checked?`<details style="margin-top:20px"><summary class="muted" style="cursor:pointer">Нужна подсказка?</summary><p class="tip">Подумай о цели: ${styles[q.answer].purpose}</p></details>`:''}<div class="quiz-actions"><button class="linkbtn" id="exit">Выйти из попытки</button><button class="btn" id="check" ${s.selected===null?'disabled':''}>${s.checked?(s.index===s.qs.length-1?'Узнать результат':'Дальше →'):'Ответить'}</button></div></article></div>`;document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{s.selected=+b.dataset.choice;quiz();$('#check').focus()});$('#exit').onclick=()=>navigate('setup');$('#check').onclick=()=>{if(s.selected===null)return;if(!s.checked){s.answers.push({id:q.id,choice:s.selected});s.checked=true;if(s.mode!=='exam'){quiz();$('#check').focus();return}}if(s.index<s.qs.length-1){s.index++;s.selected=null;s.checked=false;show('quiz')}else{show('result');if(s.mode==='exam'){saveBest();sendReport()}}}}
function saveBest(){let score=session.answers.filter(a=>questions.find(q=>q.id===a.id).answer===a.choice).length;try{if(!best()||score>best().score)localStorage.setItem('speech-best-offline',JSON.stringify({score}))}catch{}}
function makeReport(){const s=session,correct=s.answers.filter(a=>questions.find(q=>q.id===a.id).answer===a.choice).length;return `Стили речи · 6 класс\nУченик: ${s.name||'Без имени'}\nКласс: ${s.group||'не указан'}\nРежим: ${s.mode==='exam'?'Проверочная работа':'Тренировка'}\nРезультат: ${correct} из ${s.qs.length}\n\n`+s.answers.map((a,i)=>{const q=questions.find(q=>q.id===a.id);return `${i+1}. ${q.text}\nОтвет: ${styles[a.choice].name}\n${a.choice===q.answer?'Верно':'Ошибка. Правильный ответ: '+styles[q.answer].name}`}).join('\n\n')}
function results(){const s=session,score=s.answers.filter(a=>questions.find(q=>q.id===a.id).answer===a.choice).length,errors=s.answers.filter(a=>questions.find(q=>q.id===a.id).answer!==a.choice);reportText=makeReport();app.innerHTML=`<div class="quiz-wrap"><div class="score-block"><div class="eyebrow">${s.mode==='exam'?'Проверка завершена':'Практика завершена'}</div><div class="score-circle">${score}<span style="font:14px sans-serif;margin-top:-45px">из ${s.qs.length}</span></div><h2>${score===s.qs.length?'Ты отлично различаешь стили!':score/s.qs.length>=.7?'Хорошая работа!':'Теперь ты знаешь, что повторить'}</h2><p class="muted">${errors.length?'Разбери объяснения и попробуй задания, в которых ошибся.':'Все ответы верные. Попробуй замечать стили в текстах вокруг себя.'}</p><div class="actions" style="justify-content:center">${errors.length?'<button class="btn" id="retry">Разобрать ошибки ↗</button>':''}<button class="btn secondary" id="again">Новая попытка</button><button class="btn secondary" id="download">Скачать отчёт</button></div></div>${s.mode==='exam'?'<div id="report-status" class="report-status" aria-live="polite"></div>':''}<div class="panel"><h2>Твои ответы</h2><div class="results-list">${s.answers.map((a,i)=>{const q=questions.find(q=>q.id===a.id),good=a.choice===q.answer;return `<details ${good?'':'open'}><summary><span class="status ${good?'':'bad'}">${good?'✓':'✕'}</span>${i+1}. ${q.kind} · ${esc(styles[a.choice].name)}</summary><p>${esc(q.text)}</p><p><strong>Твой ответ:</strong> ${styles[a.choice].name}<br><strong>Правильный ответ:</strong> ${styles[q.answer].name}</p><p class="tip">${q.explain}</p></details>`}).join('')}</div></div></div>`;if($('#retry'))$('#retry').onclick=()=>start('retry',errors.map(a=>questions.find(q=>q.id===a.id)));$('#again').onclick=()=>{session=null;show('setup')};$('#download').onclick=()=>{let a=document.createElement('a'),url=URL.createObjectURL(new Blob([reportText],{type:'text/plain;charset=utf-8'}));a.href=url;a.download='Стили речи — результат.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};status()}
function status(){const el=$('#report-status');if(el)el.textContent='Автономный режим. Результат рассчитан на этом устройстве. Нажми «Скачать отчёт», чтобы сохранить его в файл.'}
function sendReport(){sendState='offline';status()}
show('home');
</script></body></html>
