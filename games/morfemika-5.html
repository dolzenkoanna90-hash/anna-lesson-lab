const KEY="morfemika_cinematic_v1";let done=[];try{done=JSON.parse(localStorage.getItem(KEY))||[]}catch(e){}if(!Array.isArray(done))done=[];done=done.filter(n=>Number.isInteger(n)&&n>=0&&n<5);let teacher=false,sound=false,level=0,step=0,miss=[],attempts=0,locked=false,placed=[],selected=-1;
const $=s=>document.querySelector(s);
function save(){try{localStorage.setItem(KEY,JSON.stringify(done))}catch(e){}}
function chime(ok){if(!sound)return;try{let A=window.AudioContext||window.webkitAudioContext,c=new A(),o=c.createOscillator(),g=c.createGain();o.type="sine";o.frequency.value=ok?750:270;g.gain.value=.08;o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.15);o.onended=()=>c.close()}catch(e){}}
function map(){let h="";ST.forEach((s,i)=>{let disabled=i>0&&!done.includes(i-1);h+=`<button class="place p${i} ${disabled?"locked":""} ${done.includes(i)?"done":""}" data-level="${i}" aria-label="${s.name}${disabled?", закрыто":""}"><span class="ring"><span>${s.icon}</span></span><span class="name">${s.name}</span></button>`});$("#places").innerHTML=h;document.querySelectorAll(".place").forEach(b=>b.onclick=()=>start(+b.dataset.level));$("#dots").innerHTML=`<strong style="font-size:12px;margin-right:6px">Выполнено ${done.length} из 5</strong>`+ST.map((s,i)=>`<span class="dot ${done.includes(i)?"on":""}" title="${s.name}"></span>`).join("");if(done.length===5){$("#speech").textContent="Все кристаллы собраны! Ты победил!";$("#bottom").textContent="🏆 Квест пройден. Нажми на Замок Морфемики, чтобы открыть сертификат."}}
function dialog(title,body){$("#modaltitle").textContent=title;$("#body").innerHTML=body;$("#overlay").classList.add("show")}
function close(){ $("#overlay").classList.remove("show") }
function start(i){if(i>0&&!done.includes(i-1)){let p=ST[i-1].name;$("#bottom").textContent="🔒 Сначала пройди «"+p+"».";$("#speech").textContent="Открой предыдущий портал!";return}if(i===4&&done.includes(4)){cert();return}level=i;step=0;miss=[];attempts=0;show()}
function controls(){return `<div class="rightbar"><button class="btn light" id="hint">💡 Подсказка</button><button class="btn" id="next" disabled>${step===9?"Завершить локацию":"Дальше →"}</button></div>`}
function show(){locked=false;placed=[];selected=-1;let t=ST[level].tasks[step],body=`<div class="eyebrow">Испытание ${level+1}/5 · Задание ${step+1}/10 · 💎 ${step-miss.length} правильных с первой попытки</div><div class="question">${t.q}</div>`;if(t.type==="choose"){body+=`<div class="answers" id="answerbox">${t.a.map((a,i)=>`<button class="answer" data-a="${i}">${a}</button>`).join("")}</div>`;}else if(t.type==="pick"){body+=`<p>Нажми на нужную часть слова:</p><div class="selectword" id="pickbox">${t.parts.map((p,i)=>`<button class="chip" data-a="${i}">${p}</button>`).join("")}</div>`;}else{body+=`<p>Нажимай на морфемы по порядку. Их можно также перетаскивать в ячейки.</p><div class="tokens" id="tokens">${t.parts.map((p,i)=>`<button class="token" draggable="true" data-t="${i}">${p}</button>`).join("")}</div><div class="slots" id="slots">${t.solution.map((_,i)=>`<button class="slot" data-slot="${i}"><small>${i+1}</small><span>?</span></button>`).join("")}</div><div class="rightbar"><button class="btn light" id="undo">↶ Убрать последнюю</button><button class="btn" id="check" disabled>Проверить сборку ✓</button></div>`;}body+=`<div id="feedback" aria-live="polite"></div>${controls()}${teacher?`<div class="teacher"><b>Для учителя:</b> ${t.ex}</div>`:""}`;dialog(ST[level].icon+" "+ST[level].name,body);if(t.type==="choose"||t.type==="pick"){document.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>answer(+b.dataset.a));}else{document.querySelectorAll(".token").forEach(b=>{b.onclick=()=>add(+b.dataset.t);b.addEventListener("dragstart",e=>{e.dataTransfer.setData("text/plain",b.dataset.t)})});document.querySelectorAll(".slot").forEach(b=>b.addEventListener("dragover",e=>e.preventDefault()));document.querySelectorAll(".slot").forEach(b=>b.addEventListener("drop",e=>{e.preventDefault();let n=Number(e.dataTransfer.getData("text/plain"));if(Number.isInteger(n))add(n)}));$("#undo").onclick=undo;$("#check").onclick=checkBuild;}$("#hint").onclick=()=>{$("#feedback").innerHTML=`<div class="notice">🤖 <b>Морфик подсказывает:</b> ${ST[level].hint}</div>`};$("#next").onclick=advance}
function add(n){if(locked||placed.includes(n)||placed.length>=ST[level].tasks[step].solution.length)return;placed.push(n);paint()}
function undo(){if(!locked){placed.pop();paint()}}
function paint(){const t=ST[level].tasks[step];document.querySelectorAll(".token").forEach(b=>{b.disabled=placed.includes(+b.dataset.t);b.style.opacity=b.disabled?".38":"1"});document.querySelectorAll(".slot").forEach((b,i)=>{let n=placed[i];b.querySelector("span").textContent=n===undefined?"?":t.parts[n];b.classList.toggle("filled",n!==undefined)});$("#check").disabled=placed.length!==t.solution.length}
function checkBuild(){if(locked)return;const t=ST[level].tasks[step],got=placed.map(i=>t.parts[i]);const ok=got.join("|")===t.solution.join("|");finishAnswer(ok,t.ex);$("#check").disabled=true;$("#undo").disabled=true}
function answer(n){if(locked)return;const t=ST[level].tasks[step];let ok=n===t.correct;document.querySelectorAll("[data-a]").forEach(b=>{b.disabled=true;b.classList.toggle(t.type==="pick"?"active":"good",+b.dataset.a===t.correct);if(+b.dataset.a===n&&!ok)b.classList.add("bad")});finishAnswer(ok,t.ex)}
function finishAnswer(ok,ex){locked=true;if(!ok)miss.push(step);chime(ok);$("#feedback").innerHTML=`<div class="notice"><b>${ok?"✅ Верно! Объект заряжается!":"🔎 Ошибка — запомни объяснение!"}</b><br>${ex}</div>`;$("#next").disabled=false;$("#speech").textContent=ok?"Отлично! Кристалл сияет!":"Прочитай объяснение и попробуй ещё раз.";$("#next").focus()}
function advance(){if(step<9){step++;show()}else complete()}
function complete(){let i=level;if(!done.includes(i))done.push(i);done.sort();save();map();let next=ST[i+1];dialog("💎 Кристалл восстановлен!",`<div class="cert"><div style="font-size:70px">💎✨</div><h3>${ST[i].name} спасена!</h3><p>Правильных ответов с первой попытки: <b>${10-miss.length} из 10</b>.</p><p>${next?"Открыта новая локация: <b>"+next.name+"</b>.":"Все пять кристаллов собраны! Ты спас(ла) Морфемный лес."}</p><div class="rightbar" style="justify-content:center"><button class="btn light" id="repeat">🔁 Повторить эту локацию</button><button class="btn" id="continue">${next?"Войти в новую локацию →":"🏆 Получить награду"}</button></div></div>`);$("#repeat").onclick=()=>start(i);$("#continue").onclick=()=>next?start(i+1):cert()}
function cert(){dialog("🏆 Сертификат исследователя",`<div class="cert"><div style="font-size:64px">🏅🌳💎</div><h3>Хранитель Морфемного леса</h3><p>Поздравляем! Ты успешно прошёл(прошла) пять локаций и выполнил(а) 50 заданий.</p><p><b>Ты умеешь находить корень, приставку, суффикс, окончание и разбирать слова по составу.</b></p><p>Русский язык · 5 класс · Интерактивная мастерская Анны Яковлевны</p><div class="rightbar" style="justify-content:center"><button class="btn" id="print">🖨️ Распечатать</button><button class="btn light" id="return">Вернуться к карте</button></div></div>`);$("#print").onclick=()=>{$("#printed").innerHTML="<h1>СЕРТИФИКАТ</h1><h2>Хранитель Морфемного леса</h2><p>За успешное выполнение 50 заданий по морфемике</p>";window.print()};$("#return").onclick=close}
$("#help").onclick=()=>dialog("💡 Подсказка Морфика",`<p style="font-size:20px">Исследуй игровой мир: нажимай на светящиеся объекты и проходи локации по порядку.</p><p>🌲 Окончание · 💎 Корень · 🌉 Приставка · 🗼 Суффикс · 🏰 Полный разбор.</p><p><b>Всего 50 заданий:</b> выбор ответа, поиск морфем и сборка слов из частей. После ошибки появляется объяснение.</p>`);
$("#teacher").onclick=()=>{teacher=!teacher;$("#teacher").setAttribute("aria-pressed",String(teacher));$("#teacher").textContent=teacher?"⚙️ Учитель: вкл.":"⚙️ Режим учителя"};
$("#sound").onclick=()=>{sound=!sound;$("#sound").setAttribute("aria-pressed",String(sound));$("#sound").textContent=sound?"🔊 Звук: вкл.":"🔇 Звук"};
$("#reset").onclick=()=>{if(confirm("Сбросить весь прогресс и начать заново?")){done=[];save();map();$("#bottom").textContent="🌟 Начни с Леса окончаний. Другие локации откроются по очереди.";$("#speech").textContent="Привет! Я Морфик. Начнём заново!"}};
$("#close").onclick=close;$("#overlay").onclick=e=>{if(e.target===$("#overlay"))close()};document.addEventListener("keydown",e=>{if(e.key==="Escape")close()});map();
</script></body></html>
