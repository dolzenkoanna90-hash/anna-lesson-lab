const POS=["l0","l1","l2","l3","l4"];const KEY="morfik_world_v3";let progress;try{progress=JSON.parse(localStorage.getItem(KEY))||[]}catch(e){progress=[]}if(!Array.isArray(progress))progress=[];progress=progress.filter(v=>Number.isInteger(v)&&v>=0&&v<5);let teacher=false,sound=false,current=0,question=0,mistakes=0,answered=false,review=[];
const $=s=>document.querySelector(s);
function save(){try{localStorage.setItem(KEY,JSON.stringify(progress))}catch(e){}}
function chime(ok){if(!sound)return;try{const C=window.AudioContext||window.webkitAudioContext,c=new C(),o=c.createOscillator(),g=c.createGain();o.type="sine";o.frequency.value=ok?680:260;g.gain.value=.07;o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.14);o.onended=()=>c.close()}catch(e){}}
function draw(){let h="";S.forEach((s,i)=>{let locked=i>0&&!progress.includes(i-1),done=progress.includes(i);h+=`<button class="landmark ${POS[i]} ${locked?"locked":""} ${done?"done":""}" data-i="${i}" aria-label="${s.name}${locked?", закрыто":""}"><span class="symbol"><span class="number">${i+1}</span>${s.icon}</span><span class="label">${s.name}</span></button>`});$("#places").innerHTML=h;document.querySelectorAll(".landmark").forEach(b=>b.onclick=()=>openStation(+b.dataset.i));$("#progress").textContent="Выполнено "+progress.length+" из 5";$("#gems").innerHTML=S.map((_,i)=>`<span class="gem ${progress.includes(i)?"on":""}"></span>`).join("");if(progress.length===5){$("#footertext").textContent="🏆 Все пять локаций пройдены! Нажми на Замок Морфемики, чтобы открыть награду.";$("#robottext").textContent="Ура! Ты спас(ла) Морфемный лес!";}}
function modal(title,body){$("#modaltitle").textContent=title;$("#body").innerHTML=body;$("#overlay").classList.add("show")}
function close(){ $("#overlay").classList.remove("show") }
function openStation(i){if(i>0&&!progress.includes(i-1)){let p=S[i-1].name;$("#footertext").textContent="🔒 Сначала пройди локацию «"+p+"».";$("#robottext").textContent="Путь откроется после предыдущего задания!";return}if(i===4&&progress.includes(4)){certificate();return}current=i;question=0;mistakes=0;review=[];showQuestion()}
function showQuestion(){answered=false;const s=S[current],q=s.q[question];modal(s.icon+" "+s.name,`<div class="row"><span class="counter">Испытание ${current+1} из 5 · Вопрос ${question+1} из ${s.q.length}</span><span>💎 ${Math.max(0,question-mistakes)} верно с первого раза</span></div><div class="question">${q[0]}</div><div class="options" id="options">${q[1].map((v,j)=>`<button class="option" data-answer="${j}">${v}</button>`).join("")}</div><div id="response" aria-live="polite"></div><div class="row steps"><button class="btn subtle" id="hint">💡 Подсказка Морфика</button><button class="btn" id="next" hidden>Продолжить →</button></div>${teacher?`<div class="teacherline">👩‍🏫 Для учителя: правильный ответ — ${q[1][q[2]]}. ${q[3]}</div>`:""}`);document.querySelectorAll(".option").forEach(b=>b.onclick=()=>answer(+b.dataset.answer));$("#hint").onclick=()=>{$("#response").innerHTML=`<div class="explain">🤖 <b>Морфик подсказывает:</b> ${s.hint}</div>`};$("#next").onclick=next}
function answer(a){if(answered)return;answered=true;const q=S[current].q[question],ok=a===q[2];if(!ok){mistakes++;review.push(question)}chime(ok);document.querySelectorAll(".option").forEach(b=>{let n=+b.dataset.answer;b.disabled=true;if(n===q[2])b.classList.add("right");if(n===a&&!ok)b.classList.add("wrong")});$("#response").innerHTML=`<div class="explain"><b>${ok?"✅ Верно! Кристалл сияет!":"🔎 Ничего страшного — запомни объяснение."}</b><br>${q[3]}</div>`;$("#next").hidden=false;$("#next").textContent=question===S[current].q.length-1?"Завершить испытание →":"Следующий вопрос →";$("#robottext").textContent=ok?"Отлично! Морфемы найдены!":"Ошибки помогают учиться!"}
function next(){if(question<S[current].q.length-1){question++;showQuestion();return}const i=current;if(!progress.includes(i))progress.push(i);progress.sort();save();draw();let nextName=S[i+1]?.name;modal("💎 Кристалл получен!",`<div class="cert"><div style="font-size:58px">💎✨</div><h3>${S[i].name} пройдена!</h3><p>Верных ответов с первой попытки: <b>${S[i].q.length-mistakes} из ${S[i].q.length}</b>.</p><p>${nextName?"Открылась новая локация: <b>"+nextName+"</b>.":"Все кристаллы собраны! Сундук Морфика открыт."}</p><div class="row" style="justify-content:center;margin-top:20px">${mistakes?`<button class="btn subtle" id="repeat">🔁 Повторить станцию</button>`:""}<button class="btn" id="continue">${nextName?"К следующей локации →":"🏆 Получить сертификат"}</button></div></div>`);let rep=$("#repeat");if(rep)rep.onclick=()=>openStation(i);$("#continue").onclick=()=>nextName?openStation(i+1):certificate()}
function certificate(){modal("🏆 Сертификат исследователя",`<div class="cert"><div style="font-size:65px">🏅🌳💎</div><h3>Хранитель Морфемного леса</h3><p>Поздравляем! Ты справился(лась) со всеми пятью испытаниями квеста «Тайна Морфемного леса».</p><p><b>Теперь ты умеешь находить окончание, корень, приставку и суффикс.</b></p><p style="color:#566">Русский язык · 5 класс · Мастерская Анны Яковлевны</p><button class="btn" id="print">🖨️ Распечатать награду</button> <button class="btn subtle" id="finishclose">Вернуться в мир</button></div>`);$("#print").onclick=()=>{ $("#printcert").innerHTML="<h1>СЕРТИФИКАТ</h1><h2>Хранитель Морфемного леса</h2><p>За успешное прохождение пяти испытаний квеста по морфемике</p>";window.print()};$("#finishclose").onclick=close}
$("#close").onclick=close;$("#overlay").onclick=e=>{if(e.target===$("#overlay"))close()};document.addEventListener("keydown",e=>{if(e.key==="Escape")close()});
$("#help").onclick=()=>modal("💡 Подсказка от Морфика",`<p style="font-size:20px">Исследуй игровой мир: нажимай на светящиеся объекты и выполняй задания по порядку.</p><p><b>1.</b> Окончание — изменяемая часть слова.<br><b>2.</b> Корень — общая часть родственных слов.<br><b>3.</b> Приставка находится перед корнем.<br><b>4.</b> Суффикс находится после корня.<br><b>5.</b> Для разбора сначала найди окончание и основу.</p><p>🤖 После неправильного ответа Морфик объяснит правильный разбор. Каждое испытание можно пройти снова.</p>`);
$("#teacher").onclick=()=>{teacher=!teacher;$("#teacher").setAttribute("aria-pressed",String(teacher));$("#teacher").textContent=teacher?"⚙️ Учитель: вкл.":"⚙️ Режим учителя";$("#robottext").textContent=teacher?"В режиме учителя ответы видны сразу.":"Режим ученика включён."};
$("#sound").onclick=()=>{sound=!sound;$("#sound").setAttribute("aria-pressed",String(sound));$("#sound").textContent=sound?"🔊 Звук: вкл.":"🔇 Звук"};
$("#reset").onclick=()=>{if(confirm("Начать весь квест заново?")){progress=[];save();draw();$("#footertext").textContent="🌟 Начни с Леса окончаний. Другие локации откроются по очереди.";$("#robottext").textContent="Отлично! Начнём путешествие заново."}};
draw();
</script></body></html>
