<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Мой лексический тренажёр</title><style>*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:#f7f2e7;color:#123f32;font:19px/1.6 Georgia,serif}main{max-width:800px;margin:auto;padding:35px 6vw}h1{font-size:40px;line-height:1.15;font-weight:400}h2{font-size:28px;font-weight:400;line-height:1.3}.eyebrow{font:10px/1.5 Arial;letter-spacing:2px;color:#947023}button{display:block;width:100%;text-align:left;padding:15px;margin:12px 0;background:transparent;border:1px solid #b5bda8;color:#123f32;font:17px/1.4 Arial;cursor:pointer}button:focus-visible{outline:3px solid #b38c45;outline-offset:3px}button:disabled{opacity:1;cursor:default}.correct{background:#d8ead9;border-color:#397b4c}.incorrect{background:#f3d9cf;border-color:#9e4f38}#next,#again{background:#123f32;color:#fff}#feedback{border-left:3px solid #b38c45;padding:15px;background:#eee7d6}footer{font:11px/1.6 Arial;margin-top:35px;border-top:1px solid #b38c45;padding-top:15px}</style><body><script>const DATA=[{"question":"Какое слово является архаизмом?","options":["Очи","Музей","Улица"],"answer":0,"explain":"Очи — устаревшее название глаз. Предмет существует, а название изменилось: это архаизм."}];const TITLE="Мой лексический тренажёр";(function runTrainer(){document.body.innerHTML='<main><p class="eyebrow">ИНТЕРАКТИВНАЯ МАСТЕРСКАЯ / АННА ЯКОВЛЕВНА</p><h1 id="title"></h1><p id="count"></p><h2 id="question"></h2><div id="options"></div><p id="feedback" role="status" hidden></p><button id="next" hidden>Далее →</button><button id="again" hidden>Пройти ещё раз</button><footer>Результат относится к этой попытке. Содержание заданий подготовлено автором тренажёра.</footer></main>';const $=id=>document.getElementById(id);$('title').textContent=TITLE;let pos=0,hits=0,answered=false;function render(){answered=false;$('count').textContent='Задание '+(pos+1)+' из '+DATA.length;$('question').textContent=DATA[pos].question;$('question').hidden=false;$('options').replaceChildren();$('feedback').hidden=true;$('next').hidden=true;$('again').hidden=true;DATA[pos].options.forEach((text,i)=>{let b=document.createElement('button');b.textContent=text;b.onclick=()=>{if(answered)return;answered=true;let d=DATA[pos],ok=i===d.answer;if(ok)hits++;[...$('options').children].forEach((el,j)=>{el.disabled=true;if(j===d.answer)el.className='correct';else if(j===i)el.className='incorrect'});$('feedback').textContent=(ok?'Верно. ':'Правильный ответ: '+d.options[d.answer]+'. ')+d.explain;$('feedback').hidden=false;$('next').hidden=false;$('next').textContent=pos===DATA.length-1?'Результат →':'Далее →'};$('options').append(b)})}$('next').onclick=()=>{if(!answered)return;pos++;if(pos<DATA.length)render();else{$('count').textContent='Верных ответов: '+hits+' из '+DATA.length;$('question').hidden=true;$('options').replaceChildren();$('feedback').hidden=true;$('next').hidden=true;$('again').hidden=false}};$('again').onclick=()=>{pos=0;hits=0;render()};render()})();</script></body></html>
