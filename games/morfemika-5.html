ый."},{"q":"Какое слово образовано с приставкой и суффиксом?","a":["подснежник","лесник","переписать"],"c":0,"why":"Под-снеж-ник-∅: в слове есть приставка под- и суффикс -ник-.","hint":"Найди и часть перед корнем, и после него."},{"q":"Какой суффикс в слове «домик»?","a":["-ик-","-ик"],"c":0,"why":"Дом-ик-∅: суффикс -ик-, окончание нулевое.","hint":"Сравни со словом «дом»."},{"q":"Какой суффикс в слове «лесник»?","a":["-ник-","-ик-"],"c":0,"why":"Лес-ник-∅: суффикс -ник-.","hint":"Сравни: лес, лесник."},{"q":"Найди суффикс в слове «грибной».","a":["-н-","-ой"],"c":0,"why":"Гриб-н-ой: суффикс -н-, окончание -ой.","hint":"Сравни: гриб, грибной."},{"q":"Выбери слово с суффиксом -очк-.","a":["звёздочка","звёздный"],"c":0,"why":"Звёзд-очк-а: суффикс -очк-.","hint":"Определи окончание -а, затем основу."},{"q":"Какой суффикс в слове «берёзка»?","a":["-к-","-зк-"],"c":0,"why":"Берёз-к-а: суффикс -к-, окончание -а.","hint":"Подбери однокоренное слово «берёза»."},{"q":"Найди слово с суффиксом -оват-.","a":["синеватый","синий","синева"],"c":0,"why":"Син-еват-ый: суффикс -еват- передаёт неполную степень признака.","hint":"Сравни с «синий»: слегка синий."},{"q":"Укажи суффикс слова «учитель».","a":["-тель-","-ель-","-итель-"],"c":0,"why":"Уч-и-тель-∅: в школьном разборе выделяют суффиксы -и- и -тель-. Здесь спрашивается суффикс -тель-.","hint":"Сравни с «учить» и «строитель»."},{"q":"В слове «рыбачок» какой уменьшительный суффикс?","a":["-ок-","-ач-","-чок-"],"c":0,"why":"Рыб-ач-ок-∅: уменьшительное значение передаёт суффикс -ок-.","hint":"Сравни «рыбак» и «рыбачок»; учти чередование к/ч."},{"q":"Какое слово образовано с суффиксом -еньк-?","a":["беленький","белизна","белый"],"c":0,"why":"Бел-еньк-ий: суффикс -еньк-.","hint":"Сравни «белый» и «беленький»."},{"q":"Выбери верный разбор слова «подводный».","a":["под-вод-н-ый","под-в-одн-ый","под-вод-ный"],"c":0,"why":"Под-вод-н-ый: под- (приставка), -вод- (корень), -н- (суффикс), -ый (окончание).","hint":"Сначала изменяй слово, затем подбирай однокоренные."},{"q":"Выбери верный разбор слова «лесник».","a":["лес-ник-∅","ле-сник-∅"],"c":0,"why":"Лес-ник-∅: корень -лес-, суффикс -ник-, нулевое окончание.","hint":"Лес — лесник — лесника."},{"q":"Выбери разбор слова «записка».","a":["за-пис-к-а","зап-ис-к-а"],"c":0,"why":"За-пис-к-а: за- — приставка, -пис- — корень, -к- — суффикс, -а — окончание.","hint":"Сравни: писать, запись, записка."},{"q":"В слове «подводный» сколько значимых частей, включая окончание?","a":["четыре","три"],"c":0,"why":"Под-вод-н-ый: приставка, корень, суффикс, окончание — четыре морфемы.","hint":"Выпиши части отдельно."},{"q":"Выбери правильный разбор слова «берёзка».","a":["берёз-к-а","бе-рёзк-а"],"c":0,"why":"Берёз-к-а: корень -берёз-, суффикс -к-, окончание -а.","hint":"Берёза — берёзка."},{"q":"В слове «пришкольный» какая приставка?","a":["при-","приш-"],"c":0,"why":"При-школь-н-ый: приставка при-, корень -школь-, суффикс -н-, окончание -ый.","hint":"Сравни со словом «школьный»."},{"q":"Выбери правильный разбор слова «перелесок».","a":["пере-лес-ок-∅","пер-елес-ок-∅"],"c":0,"why":"Пере-лес-ок-∅: приставка пере-, корень -лес-, суффикс -ок-, нулевое окончание.","hint":"Сравни: лес, лесок, перелесок."},{"q":"Найди правильный разбор слова «снежинка».","a":["снеж-инк-а","сне-жинк-а","сн-еж-инк-а"],"c":0,"why":"Снеж-инк-а: корень -снеж-, суффикс -инк-, окончание -а. В родственных словах чередуются г/ж: снег — снежный.","hint":"Сравни «снег» и «снежный»."},{"q":"Где верно выделены корни в слове «пароход»?","a":["-пар- и -ход-","-пароход-","-аро- и -ход-"],"c":0,"why":"Пар-о-ход-∅: два корня -пар- и -ход-, соединительная гласная -о-, нулевое окончание.","hint":"Это сложное слово."},{"q":"Как правильно разобрать «подснежник»?","a":["под-снеж-ник-∅","подс-неж-ник-∅","под-сне-жник-∅"],"c":0,"why":"Под-снеж-ник-∅: приставка под-, корень -снеж-, суффикс -ник-, нулевое окончание.","hint":"Сравни: снег — снежный — подснежник."},{"q":"Какой порядок морфемного разбора верен?","a":["Окончание → основа → корень → приставка и суффикс","Приставка → окончание → корень","Суффикс → корень → окончание"],"c":0,"why":"Сначала изменяем слово и определяем окончание и основу, затем подбираем однокоренные слова, выделяем корень, после него приставку и суффикс.","hint":"Сначала нужно понять, какая часть изменяется."}];

Прогресс':'🏆 Награды'}</h2><p>${copy}</p><button class="primary" id="okFeature">Понятно</button>`);$('okFeature').onclick=hideModal});updateHud();return;}
$('select').classList.remove('hidden');$('select').innerHTML=STAGES.map((s,i)=>`<button class="chapter ${i===current?'active':''} ${i>unlocked?'locked':''} ${finished(i)?'done':''}" data-stage="${i}" ${i>unlocked?'disabled':''}>${s.icon} ${s.short}<small>${i>unlocked?'🔒 Закрыто':finished(i)?'Все 10 выполнены':''+countStage(i)+'/10 заданий'}</small></button>`).join('');document.querySelectorAll('[data-stage]').forEach(b=>b.onclick=()=>{current=+b.dataset.stage;save();frame()});let stage=STAGES[current];const route=`M 180 115 C 280 30, 360 50, 430 85 S 730 150, 750 230 S 520 330, 340 310 S 120 340, 170 420 S 450 500, 660 460 S 820 530, 680 590 S 400 650, 560 665`;const stops=POS.map(([x,y],i)=>{let id=current*10+i;let done=completed.includes(id),blocked=i>0&&!completed.includes(current*10+i-1);return `<button class="stop ${done?'completed':''} ${blocked?'locked':''} ${!done&&!blocked?'current':''}" style="left:${x}%;top:${y}%" data-stop="${i}" ${blocked?'disabled':''} aria-label="Задание ${i+1} ${done?'пройдено':blocked?'закрыто':'доступно'}"><span class="num">${i+1}</span><span class="symbol">${done?'💎':i===9?'🗝️':stage.icon}</span><span class="tag">${i>=7?'★ ':''}${LABELS[i]}</span>${done?'<span class="check">✓</span>':''}</button>`}).join('');
$('scene').innerHTML=`<div class="scene-title"><span class="ribbon">Локация ${current+1} из 5 · ${countStage(current)} / 10</span><h1>${stage.name}</h1><p>${stage.subtitle}</p></div><div class="route-wrap"><svg class="route-svg" viewBox="0 0 1000 740" preserveAspectRatio="none" aria-hidden="true"><path class="path-base" d="${route}"/><path class="path-inner" d="${route}"/><path class="path-dashes" d="${route}"/></svg><div class="stage-illustration second" aria-hidden="true">${stage.extra}</div><div class="stage-illustration" aria-hidden="true">${stage.deco}</div>${stops}<div class="route-note">🟢 Верный ответ ведёт дальше · 🔴 Ошибка — подсказка и новый выбор</div></div>`;document.querySelectorAll('[data-stop]').forEach(b=>b.onclick=()=>openTask(+b.dataset.stop));updateHud()}
function countStage(n){return completed.filter(x=>Math.floor(x/10)===n).length}function finished(n){return countStage(n)===10}
function showModal(label,html){$('modal-label').textContent=label;$('modal-content').innerHTML=html;$('overlay').classList.remove('hidden');$('close').focus()}
function hideModal(){$('overlay').classList.add('hidden');active=-1;wrong=false;frame()}
function openTask(n){active=current*10+n;wrong=false;const t=TASKS[active],already=completed.includes(active);showModal(`${STAGES[current].name} · Задание ${n+1} из 10`, `<div class="bar"><div style="width:${(n+1)*10}%"></div></div><p class="instruction">${n<=2?'🌱 Базовый уровень':n<=6?'🌿 Средний уровень':'🌟 Повышенная сложность'} · Выбери верный ответ.</p><h2 id="modal-title">${esc(t.q)}</h2><div class="answer-list">${t.a.map((v,i)=>`<button class="answer" data-answer="${i}">${esc(v)}</button>`).join('')}</div><div id="feedback" aria-live="polite"></div><div class="modal-actions"><button class="secondary" id="help">💡 Подсказка</button><button class="secondary" id="back">← На карту</button></div>`);$('help').onclick=()=>{const f=$('feedback');f.className='feedback';f.innerHTML='<b>💡 Подсказка</b>'+esc(t.hint)};$('back').onclick=hideModal;document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>choose(+b.dataset.answer))}
function choose(i){let t=TASKS[active];if(i===t.c){chime(true);const previously=completed.includes(active);if(!previously){completed.push(active);completed.sort((a,b)=>a-b)}const stage=Math.floor(active/10),last=active%10===9;if(last&&finished(stage))unlocked=Math.max(unlocked,Math.min(4,stage+1));save();document.querySelectorAll('[data-answer]').forEach(b=>{b.disabled=true;if(+b.dataset.answer===i)b.classList.add('good')});const txt=last?'🏆 Кристалл станции найден!':'🟢 Верная дорожка открыта!';$('feedback').className='feedback good';$('feedback').innerHTML='<b>'+txt+'</b>'+esc(t.why);let button= last? (stage===4?'🏆 Получить сертификат':'🌈 В следующую локацию'):'➡️ На следующий шаг';$('modal-content').querySelector('.modal-actions').innerHTML=`<button class="primary" id="goNext">${button}</button>`;$('goNext').onclick=()=>{if(last){if(stage===4){certificate();return}current=stage+1;save();hideModal();return}let next=active%10+1;hideModal();openTask(next)};
}else{chime(false);wrong=true;const f=$('feedback');f.className='feedback bad';f.innerHTML='<b>🔴 Эта дорожка ведёт в тупик.</b>'+esc(t.hint)+' Попробуй выбрать другой ответ!';document.querySelectorAll('[data-answer]').forEach(b=>b.classList.toggle('bad',+b.dataset.answer===i));}}
function certificate(){completed=Array.from({length:50},(_,i)=>i);unlocked=4;save();updateHud();showModal('Сокровище найдено!',`<div class="finish"><div class="success-float">🏆🦋💎</div><h2 id="modal-title">Тайна раскрыта!</h2><div class="cert"><div class="cert-heading">🌸 ✨ СЕРТИФИКАТ ЮНОГО ИССЛЕДОВАТЕЛЯ ✨ 🌸</div><div class="cert-ribbon">🏆 5 волшебных локаций · 50 заданий</div><strong>Мастер Морфемики</strong><span class="cert-name">Имя участника: __________________</span><p>За успешное прохождение квеста<br>«Тайна Морфемного леса»<br>и отличную работу с составом слова!</p><small>🌳 🦋 Мастерская Анны Яковлевны · Русский язык · 5 класс 🦋 🌳</small></div><p>Ты открыл замок знаний и помог Морфику собрать все волшебные кристаллы!</p><div class="modal-actions" style="justify-content:center"><button class="primary" id="printCert">🖨️ Сохранить сертификат</button><button class="secondary" id="finishClose">Вернуться на карту</button></div></div>`);$('printCert').onclick=()=>{document.body.classList.add('print-cert');window.print();};window.addEventListener('afterprint',()=>document.body.classList.remove('print-cert'));$('finishClose').onclick=hideModal;}
$('close').onclick=hideModal;$('overlay').addEventListener('click',e=>{if(e.target===$('overlay'))hideModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('overlay').classList.contains('hidden'))hideModal()});$('homeLink').onclick=e=>{e.preventDefault();hasStarted=false;save();frame()};$('sound').onclick=()=>{sound=!sound;$('sound').textContent=sound?'🔊 Звук: вкл.':'🔇 Звук: выкл.'};$('reset').onclick=()=>{if(confirm('Начать квест заново? Все собранные кристаллы будут сброшены.')){completed=[];unlocked=0;current=0;hasStarted=false;save();frame()}};frame();
