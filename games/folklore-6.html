{id:18,kind:'Песни и обряды',prompt:'К какому жанру относятся колядки?',text:'Во время зимних праздников исполнители обходят дома и желают хозяевам благополучия.',options:['Календарные обрядовые песни','Бытовые сказки','Скороговорки','Былины'],answer:0,explain:'Колядки относятся к календарному обрядовому фольклору и связаны с зимним праздничным периодом.'},

const $=s=>document.querySelector(s);const app=$('#app');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let page='home',styleIndex=0,session=null,pendingPage=null,sendState='idle',reportText='';let telegramReady=false;
function best(){try{return JSON.parse(localStorage.getItem('folklore-best-offline')||'null')}catch{return null}}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function navigate(next){if(page==='quiz'&&session){pendingPage=next;$('#exitDialog').showModal();return}show(next)}
$('#cancelExit').onclick=()=>$('#exitDialog').close();$('#confirmExit').onclick=()=>{$('#exitDialog').close();session=null;show(pendingPage)};
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>navigate(b.dataset.page));
function show(next){page=next;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===next||(b.dataset.page==='setup'&&['quiz','result'].includes(next))));if(next==='home')home();if(next==='theory')theory();if(next==='setup')setup();if(next==='quiz')quiz();if(next==='result')results();window.scrollTo({top:0});}
function home(){const b=best();app.innerHTML=`<section class="hero"><div><div class="eyebrow">Литература · 6 класс</div><h1>Истории,<br>которые живут.</h1><p class="muted">Открой мир сказок, былин и народной мудрости. Пройди задания, узнай оценку и разбери свои ошибки.</p><div class="actions"><button class="btn" id="start">Пройти тренажёр <span>↗</span></button><button class="btn secondary" id="learn">Сначала памятка</button></div><p class="hero-foot"><span>20 заданий</span><span>≈ 15 минут</span><span>6 класс</span></p></div><div class="visual" aria-label="Жанры народного творчества"><div class="visual-title">ОТ ПОКОЛЕНИЯ К ПОКОЛЕНИЮ</div><div class="bubble"><small>Пословица</small>Без труда не вытащишь и рыбку из пруда.</div><div class="bubble"><small>Народная сказка</small>Жили-были…</div><div class="bubble"><small>Былина</small>Богатырский подвиг и сила духа.</div></div></section><section><div class="section-title"><h2>Пять ключей к фольклору</h2><span class="pill">5 разделов</span></div><div class="style-grid">${styles.map((s,i)=>`<button class="style-card" data-style="${i}"><span class="icon" aria-hidden="true">${s.icon}</span><h3>${s.name}</h3><p>${s.tag} <span aria-hidden="true">↗</span></p></button>`).join('')}</div><div class="bottom-note"><b>Как узнать жанр?</b><p>Посмотри на <strong>содержание</strong>, <strong>построение</strong> и <strong>назначение</strong> текста. Фольклор передаётся от поколения к поколению и может существовать в разных вариантах.</p></div>${b?`<p class="muted">Твой лучший результат в тренажёре: <strong>${b.score} из 20</strong>.</p>`:''}</section>`;$('#start').onclick=()=>{show('setup');$('#name').focus()};$('#learn').onclick=()=>show('theory');document.querySelectorAll('[data-style]').forEach(b=>b.onclick=()=>{styleIndex=Number(b.dataset.style);show('theory')})}
function theory(){let s=styles[styleIndex];app.innerHTML=`<div class="eyebrow">Памятка</div><h2 style="margin-top:12px">Вспомни главное о народном творчестве</h2><p class="muted">Выбери раздел и повтори основные понятия.</p><div class="theory-layout"><aside class="style-menu" aria-label="Фольклор">${styles.map((s,i)=>`<button class="${i===styleIndex?'active':''}" data-style="${i}" aria-pressed="${i===styleIndex}">${s.name}</button>`).join('')}</aside><article class="panel"><span class="eyebrow">${s.tag}</span><h2 style="margin-top:12px">${s.name}</h2><div class="detail-grid"><div><span class="label">Главное</span>${s.purpose}</div><div><span class="label">Где встречается</span>${s.where}</div></div><span class="label">Как узнать</span><p>${s.features}</p><span class="label">Пример</span><blockquote>${s.example}</blockquote><div class="tip">${s.note}</div><div class="actions"><button class="btn" id="practice">Попробовать в деле ↗</button></div></article></div><div class="bottom-note"><b>Обрати внимание</b><p>Народное произведение и литературное произведение — не одно и то же. У литературного произведения есть известный автор. Собиратель записывает фольклорный текст, сохраняя народную традицию.</p></div>`;document.querySelectorAll('[data-style]').forEach(b=>b.onclick=()=>{styleIndex=+b.dataset.style;theory()});$('#practice').onclick=()=>show('setup')}
function setup(){app.innerHTML=`<div class="quiz-wrap"><div class="eyebrow">Тренажёр · 6 класс</div><h2 style="margin-top:12px">Проверь себя и узнай оценку</h2><p class="muted">20 заданий: понятия, жанры, сюжеты и художественные средства. За каждый правильный ответ — 1 балл.</p><div class="form-row"><label class="field">Имя ученика (необязательно) <input id="name" autocomplete="name" maxlength="80" placeholder="Например, Маша Иванова"></label><label class="field">Класс или группа <input id="group" maxlength="30" placeholder="Например, 6Б"></label></div><p class="muted" style="font-size:13px">Интернет не нужен. Результат и объяснения появятся в конце. Отчёт можно сохранить на этом устройстве.</p><p id="form-error" class="error" role="alert"></p><article class="mode-card dark"><span class="eyebrow" style="color:var(--lime)">Оценка по пятибалльной шкале</span><h2 style="margin-top:14px">Как считается результат</h2><div class="grade-scale"><div><b>5</b><span>18–20 баллов</span></div><div><b>4</b><span>14–17 баллов</span></div><div><b>3</b><span>10–13 баллов</span></div><div><b>2</b><span>0–9 баллов</span></div></div><p class="muted">Можно заниматься без ограничения времени. Ответы принимаются один раз в каждой попытке.</p><button class="btn light" id="exam">Начать прохождение ↗</button></article></div>`;$('#exam').onclick=()=>start('exam')}
function start(mode,qs=null){const name=$('#name')?.value.trim()||session?.name||'Ученик',group=$('#group')?.value.trim()||session?.group||'';session={mode,name,group,qs:shuffle(qs||questions).map(q=>({...q,displayOptions:shuffle(q.options.map((_,i)=>i))})),index:0,answers:[],selected:null,checked:false,started:Date.now(),attemptId:globalThis.crypto?.randomUUID?.()||String(Date.now())};sendState='offline';show('quiz')}
function quiz(){let s=session,q=s.qs[s.index];app.innerHTML=`<div class="quiz-wrap"><div class="topline"><span class="eyebrow">${s.mode==='exam'?'Тренажёр':s.mode==='retry'?'Работа над ошибками':'Тренировка'}</span><span class="muted">Задание ${s.index+1} из ${s.qs.length}</span></div><div class="progress" role="progressbar" aria-label="Прогресс" aria-valuemin="0" aria-valuemax="${s.qs.length}" aria-valuenow="${s.index}"><div style="width:${s.index/s.qs.length*100}%"></div></div><article class="panel"><span class="label">${q.kind}</span><h2>${q.prompt}</h2><div class="question-text">${esc(q.text)}</div><div class="options" role="group" aria-label="Варианты ответа">${q.displayOptions.map((i,pos)=>`<button class="option ${s.selected===i?'selected':''} ${s.checked&&s.mode!=='exam'?(i===q.answer?'correct':s.selected===i?'wrong':''):''}" data-choice="${i}" aria-pressed="${s.selected===i}" ${s.checked?'disabled':''}><span>${pos+1}</span>${esc(q.options[i])}${s.checked&&s.mode!=='exam'&&i===q.answer?' ✓':''}</button>`).join('')}</div><div id="feedback" aria-live="polite">${s.checked&&s.mode!=='exam'?`<div class="feedback ${s.selected===q.answer?'':'wrong'}"><strong>${s.selected===q.answer?'Верно!':'Разберёмся вместе'}</strong><p>${s.selected===q.answer?'':'Правильный ответ: '+esc(q.options[q.answer])+'. '}${q.explain}</p></div>`:''}</div>${s.mode!=='exam'&&!s.checked?`<details style="margin-top:20px"><summary class="muted" style="cursor:pointer">Нужна подсказка?</summary><p class="tip">${q.explain}</p></details>`:''}<div class="quiz-actions"><button class="linkbtn" id="exit">Выйти из попытки</button><button class="btn" id="check" ${s.selected===null?'disabled':''}>${s.checked?(s.index===s.qs.length-1?'Узнать результат':'Дальше →'):'Ответить'}</button></div></article></div>`;document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{s.selected=+b.dataset.choice;quiz();$('#check').focus()});$('#exit').onclick=()=>navigate('setup');$('#check').onclick=()=>{if(s.selected===null)return;if(!s.checked){s.answers.push({id:q.id,choice:s.selected});s.checked=true;if(s.mode!=='exam'){quiz();$('#check').focus();return}}if(s.index<s.qs.length-1){s.index++;s.selected=null;s.checked=false;show('quiz')}else{show('result');if(s.mode==='exam'){saveBest();sendReport()}}}}
function saveBest(){let score=session.answers.filter(a=>questions.find(q=>q.id===a.id).answer===a.choice).length;try{if(!best()||score>best().score)localStorage.setItem('folklore-best-offline',JSON.stringify({score}))}catch{}}
function makeReport(){const s=session,correct=s.answers.filter(a=>questions.find(q=>q.id===a.id).answer===a.choice).length;return `Фольклор · 6 класс\nУченик: ${s.name||'Без имени'}\nКласс: ${s.group||'не указан'}\nРежим: ${s.mode==='exam'?'Полное прохождение':'Работа над ошибками'}\nРезультат: ${correct} из ${s.qs.length}\n${s.mode==='exam'?'Оценка: '+gradeFor(correct)+'\n':''}\n\n`+s.answers.map((a,i)=>{const q=questions.find(q=>q.id===a.id);return `${i+1}. ${q.prompt}\n${q.text}\nОтвет: ${q.options[a.choice]}\n${a.choice===q.answer?'Верно':'Ошибка. Правильный ответ: '+q.options[q.answer]}`}).join('\n\n')}
function results(){const s=session,score=s.answers.filter(a=>questions.find(q=>q.id===a.id).answer===a.choice).length,errors=s.answers.filter(a=>questions.find(q=>q.id===a.id).answer!==a.choice);reportText=makeReport();app.innerHTML=`<div class="quiz-wrap"><div class="score-block"><div class="eyebrow">${s.mode==='exam'?'Тренажёр завершён':'Практика завершена'}</div><div style="margin:22px 0">${s.mode==='exam'?'<div class="grade-large">'+gradeFor(score)+'</div><strong>Твоя оценка</strong>':''}<p class="muted">${score} из ${s.qs.length} баллов · ${Math.round(score/s.qs.length*100)}% верных ответов</p></div><h2>${score===s.qs.length?'Ты отлично знаешь фольклор!':score/s.qs.length>=.7?'Хорошая работа!':'Теперь ты знаешь, что повторить'}</h2><p class="muted">${errors.length?'Разбери объяснения и попробуй задания, в которых ошибся.':'Все ответы верные. Народные жанры тебе хорошо знакомы!'}</p><div class="actions" style="justify-content:center">${errors.length?'<button class="btn" id="retry">Разобрать ошибки ↗</button>':''}<button class="btn secondary" id="again">Новая попытка</button><button class="btn secondary" id="download">Скачать отчёт</button></div></div>${s.mode==='exam'?'<div id="report-status" class="report-status" aria-live="polite"></div>':''}<div class="panel"><h2>Твои ответы</h2><div class="results-list">${s.answers.map((a,i)=>{const q=questions.find(q=>q.id===a.id),good=a.choice===q.answer;return `<details ${good?'':'open'}><summary><span class="status ${good?'':'bad'}">${good?'✓':'✕'}</span>${i+1}. ${q.kind} · ${esc(q.options[a.choice])}</summary><p><strong>${esc(q.prompt)}</strong></p><p>${esc(q.text)}</p><p><strong>Твой ответ:</strong> ${esc(q.options[a.choice])}<br><strong>Правильный ответ:</strong> ${esc(q.options[q.answer])}</p><p class="tip">${q.explain}</p></details>`}).join('')}</div></div></div>`;if($('#retry'))$('#retry').onclick=()=>start('retry',errors.map(a=>questions.find(q=>q.id===a.id)));$('#again').onclick=()=>{session=null;show('setup')};$('#download').onclick=()=>{let a=document.createElement('a'),url=URL.createObjectURL(new Blob([reportText],{type:'text/plain;charset=utf-8'}));a.href=url;a.download='Фольклор — '+(s.name||'ученик').replace(/[\\/:*?"<>|]/g,'')+' — результат.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};status()}
function status(){const el=$('#report-status');if(el)el.textContent='Автономный режим. Результат рассчитан на этом устройстве. Нажми «Скачать отчёт», чтобы сохранить его в файл.'}
function sendReport(){sendState='offline';status()}
show('home');
</script></body></html>
