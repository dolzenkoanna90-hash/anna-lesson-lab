<style>

*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}

@keyframes modalIn{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
#modal h2{font-size:22px;color:#4a5568;margin:0 0 8px}

<script>

const SUBJECT="Литература", GRADE=6, TOPIC="Творчество А. С. Пушкина", TOTAL=12;
const questions=[
{q:"Как называется роман А. С. Пушкина о Владимире и Троекуровых?",a:["«Дубровский»","«Капитанская дочка»","«Евгений Онегин»"],correct:0},

{q:"Как звали дочь Кирилы Петровича Троекурова?",a:["Марья Кириловна","Татьяна Ларина","Дуня Вырина"],correct:0},
{q:"Кем выдавал себя Владимир Дубровский в доме Троекурова?",a:["Учителем-французом Дефоржем","Молодым офицером","Земским судьёй"],correct:0},
{q:"Какое событие стало причиной ссоры Дубровского-старшего с Троекуровым?",a:["Оскорбление псарём Дубровского","Отказ Марьи выйти замуж","Пропажа семейного портрета"],correct:0},

];

let collected=0,tasksCompleted=0,taskModalOpen=false,currentTask=null,locked=false,pausedAt=0,last=performance.now(),spawnClock=0;
let bearX=0, targetX=0, bearMoved=false, active=true;
const bearWrap=$("bearWrap"),bearFloat=$("bearFloat"),bearEl=$("bear"),overlay=$("overlay");

function initAmbient(){const box=$("ambient");for(let i=0;i<20;i++){const e=document.createElement("div");e.className="ambient";e.textContent="✦";e.style.left=(Math.random()*100)+"%";e.style.fontSize=(10+Math.random()*16)+"px";e.style.animationDuration=(12+Math.random()*19)+"s";e.style.animationDelay=(-Math.random()*24)+"s";box.appendChild(e)}}

function spawnSnow(){if(taskModalOpen||!active)return;const task=Math.random()<.5&&tasksCompleted<TOTAL;const el=document.createElement("div");el.className="falling"+(task?" task":"");el.innerHTML=CARROT;el.setAttribute("aria-label",task?"Морковка с вопросом":"Морковка");const obj={el,task,x:36+Math.random()*Math.max(10,innerWidth-72),y:-95,speed:(innerHeight+170)/(9+Math.random()*9),phase:Math.random()*6.28,spin:Math.random()*360,born:performance.now()};el.style.transform="translate("+obj.x+"px,-95px)";$("flakes").appendChild(el);flakes.push(obj)}

function catchSnow(s){const idx=flakes.indexOf(s);if(idx>=0)flakes.splice(idx,1);s.el.remove();bearFloat.classList.remove("catch");void bearFloat.offsetWidth;bearFloat.classList.add("catch");setTimeout(()=>bearFloat.classList.remove("catch"),400);
 if(s.task){openQuestion()}else{collected++;$("snowCount").textContent=collected;popParticles(s.x,s.y);toast("🥕 Морковка поймана! +1")}}
function tick(now){const dt=Math.min(.05,(now-last)/1000);last=now;if(!taskModalOpen&&active){updateBear();spawnClock+=dt;if(spawnClock>1.75){spawnClock=0;spawnSnow()}
 const b=bearWrap.getBoundingClientRect(),bx=b.left+b.width/2,by=b.top+b.height*.70,threshold=b.width*.24;

 if(Math.hypot(sx-bx,sy-by)<threshold){catchSnow(s);if(taskModalOpen)break}
 else if(s.y>innerHeight+90){s.el.remove();flakes.splice(i,1)}
 }}requestAnimationFrame(tick)}
