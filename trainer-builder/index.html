      { text: 'Выбери слово, которое состоит из приставки, корня, суффикса и окончания.', options: ['Подводный', 'Лесной', 'Вода', 'Вчера'], answer: 0, explanation: 'Под-вод-н-ый: под- — приставка, -вод- — корень, -н- — суффикс, -ый — окончание.', points: 1 },

  {

      { text: 'Подбери современный синоним к каждому устаревшему слову.', pairs: [['уста', 'губы'], ['длань', 'ладонь'], ['лобзать', 'целовать']], explanation: 'При замене этих слов сохраняется основное значение, но меняется стилистическая окраска.', points: 1 },
      { text: 'Соотнеси название с реалией прошлого.', pairs: [['кольчуга', 'доспех из металлических колец'], ['ямщик', 'возница на почтовой дороге'], ['стрелец', 'воин стрелецкого войска']], explanation: 'Эти слова помогают назвать конкретные предметы, занятия и воинские должности прошлого.', points: 1 },

function blankQuestion(type) {
  return { type, text:'', hint:'', explanation:'', points:1, options:['','',''], answer:type==='choice'?[]:-1, pairsText:'', orderText:'', pattern:'', blanksText:'' };
}
function editorQuestion(q) {
  return { ...blankQuestion(q.type), ...copy(q), pairsText:list(q.pairs).map(pair=>pair.join(' = ')).join('\n'), orderText:list(q.order).join('\n'), blanksText:list(q.blanks).map(row=>row.join(' | ')).join('\n') };
}
function questionFromEditor(q) {
  const lines = value => String(value ?? '').split(/\r?\n/).map(trim).filter(Boolean);
  const common = { type:q.type, text:trim(q.text), hint:trim(q.hint), explanation:trim(q.explanation), points:Number(q.points) };
  if (isChoice(q.type)) return { ...common, options:q.options.map(trim), answer:q.answer };
  if (q.type==='match') return { ...common, pairs:lines(q.pairsText).map(line => { const cut=line.indexOf('='); return cut<0 ? [line] : [trim(line.slice(0,cut)),trim(line.slice(cut+1))]; }) };
  if (q.type==='drag') return { ...common, order:lines(q.orderText) };
  return { ...common, pattern:trim(q.pattern), blanks:lines(q.blanksText).map(line=>line.split('|').map(trim)) };
}
function rememberDraft() { db.draft = draft; saveLocal(); }
function newDraft(source, editing = false) {
  const base = source ? canonicalTrainer(source) : { title:'', grade:'5', subject:subjects[0], topic:'', level:levels[0], type:'test', criteria:'', tone:'violet' };
  const questions = source?.questions?.length ? source.questions.map(editorQuestion) : Array.from({length:source?.count ?? 3},()=>blankQuestion(base.type));
  draft = { ...base, title:source && !editing && source.questions?.length ? `${base.title} (копия)`.slice(0,140) : base.title, id:editing ? base.id : null, questions };
  step = editing ? 2 : 1;
  questionIndex = 0;
  rememberDraft();
  openView('wizard');
}
function requestDraft(source, editing = false) {
  if (draft && (!editing || draft.id!==source?.id) && (trim(draft.title) || draft.questions.some(q=>trim(q.text)))) {
    dialog('Открыт черновик',`<p>Продолжите работу с ним или замените его новым черновиком.</p><div class="actions">${button('Продолжить черновик','resume','edit','primary')}${button('Заменить черновик','replace-draft',null,'danger')}</div>`);
    modal.querySelector('[data-action="replace-draft"]').addEventListener('click',()=>{ modal.close(); newDraft(source,editing); },{once:true});
    return;
  }
  if (editing && draft?.id===source?.id) return openView('wizard');
  newDraft(source,editing);
}
function metaProblem() {
  if (!trim(draft.title)) return 'Введите название тренажёра.';
  if (!trim(draft.topic)) return 'Укажите тему.';
  return '';
}
function wizardError(message) {
  error = message;
  render();
  root.querySelector('.error')?.focus();
}
function changeStep(next) {
  if (!commitCount()) return;
  if (next > 1) { const message=metaProblem(); if (message) { step=1; return wizardError(message); } }
  if (next===3) {
    const invalid = draft.questions.findIndex(q=>problem(questionFromEditor(q)));
    if (invalid>=0) { step=2; questionIndex=invalid; return wizardError(`Задание ${invalid+1}. ${problem(questionFromEditor(draft.questions[invalid]))}`); }
  }
  step = next;
  openView('wizard');
}
function editorOptions(q) {
  const many=q.type==='choice';
  return `<div class="field"><span>Варианты и правильный ответ</span><small>${many ? 'Отметьте все верные варианты.' : 'Отметьте один верный вариант.'}</small></div>${q.options.map((value,i)=>`<div class="option-edit"><input type="${many?'checkbox':'radio'}" name="correct-answer" data-answer="${i}" aria-label="Вариант ${i+1} верный" ${(many ? list(q.answer).includes(i) : q.answer===i)?'checked':''}><input class="inline-input" value="${escape(value)}" data-option="${i}" placeholder="Вариант ${i+1}" aria-label="Вариант ${i+1}" maxlength="400">${iconButton('Убрать вариант','remove-option','x',`data-index="${i}" ${q.options.length<=2?'disabled':''}`)}</div>`).join('')}${button('Добавить вариант','add-option','plus','quiet',q.options.length>=12?'disabled':'')}`;
}

  if (q.type==='match') controls=wrapField('Пары и правильные соответствия',area('pairsText',q.pairsText,'question','очи = глаза\nперст = палец',4),'Каждую пару пишите с новой строки. Между частями ставьте знак =. До 20 пар.');
  if (q.type==='drag') controls=wrapField('Элементы в правильном порядке',area('orderText',q.orderText,'question','Первое событие\nВторое событие',4),'Каждый элемент пишите с новой строки. До 20 элементов.');
  if (q.type==='fill') controls=wrapField('Текст с пропусками',area('pattern',q.pattern,'question','Когда? ___ · Где? ___'),'Обозначьте каждый пропуск тремя подчёркиваниями ___. До 20 пропусков.')+wrapField('Правильные ответы',area('blanksText',q.blanksText,'question','вчера\nво дворе | на дворе'),'Один пропуск — одна строка. Допустимые варианты разделяйте знаком |. Регистр и лишние пробелы не учитываются.');
  return `<div class="question-editor"><div class="question-nav" aria-label="Список заданий">${draft.questions.map((_,i)=>button(`<span>Задание ${i+1}</span>`,'select-question',null,i===questionIndex?'active':'',`data-index="${i}" ${i===questionIndex?'aria-current="true"':''}`)).join('')}${button('Добавить','add-question','plus','quiet add',draft.questions.length>=100?'disabled':'')}</div><section class="panel"><div class="editor-top"><h2>Задание ${questionIndex+1}</h2>${iconButton('Удалить задание','remove-question','trash',draft.questions.length<=1?'disabled':'')}</div>
  <div class="field-grid">${wrapField('Тип задания',select('type',formatOptions,q.type,'question'))}${wrapField('Баллы за верный ответ',input('points',q.points,'question','','type="number" min="1" max="100" step="1"'))}</div>${wrapField('Текст задания',area('text',q.text,'question','Напишите, что нужно сделать ученику',3))}${controls}
  <div class="field-grid form-spaced">${wrapField('Подсказка',area('hint',q.hint,'question','Необязательное поле'))}${wrapField('Краткое объяснение',area('explanation',q.explanation,'question','Необязательное поле'))}</div></section></div>`;
}
function renderWizard() {
  const steps = `<div class="steps" aria-label="Шаги конструктора">${['Настройки','Задания','Предпросмотр и сохранение'].map((label,i)=>`<button type="button" data-action="step" data-index="${i+1}" class="step ${step===i+1?'active':''}" ${step===i+1?'aria-current="step"':''}><span>${i+1}</span>${label}</button>`).join('')}</div>`;
  let content;
  if (step===1) content=`<section class="panel"><h2>Настройки тренажёра</h2><div class="field-grid form-spaced">${wrapField('Название',input('title',draft.title,'meta','Например, Состав слова','maxlength="140"'))}${wrapField('Тема',input('topic',draft.topic,'meta','Например, Морфемика','maxlength="100"'))}${wrapField('Класс',select('grade',gradeOptions,draft.grade,'meta'))}${wrapField('Предмет',select('subject',subjects,draft.subject,'meta'))}${wrapField('Сложность',select('level',levels,draft.level,'meta'))}${wrapField('Количество заданий',input('count',draft.questions.length,'meta','','type="number" min="1" max="100" step="1"'),'От 1 до 100. Можно добавить задания на следующем шаге.')}</div>
  <h3>Основной формат</h3><div class="formats">${Object.entries(formats).map(([type,[label,glyph,help]])=>`<button type="button" class="format ${draft.type===type?'active':''}" data-action="choose-format" data-value="${type}" aria-pressed="${draft.type===type}" title="${help}">${icon(glyph)}${label}</button>`).join('')}</div>${wrapField('Критерии оценивания',area('criteria',draft.criteria,'meta','Например, «5» за 8–10 баллов.'))}</section>`;
  if (step===2) content=renderQuestionEditor();
  if (step===3) content=`<section class="panel"><h2>${escape(draft.title)}</h2><p class="muted">${draft.grade} класс · ${escape(draft.subject)} · ${escape(draft.topic)} · ${escape(draft.level)} · ${countLabel(draft.questions.length)}</p><div class="actions details-actions">${button('Предпросмотр ученика','preview','eye')}${button('Сохранить шаблон','save-template','folder')}</div>${keyList(draft.questions.map(questionFromEditor))}</section>`;
  const left = step===1 ? button('Сохранить шаблон','save-template','folder') : button('Назад','step','back','',`data-index="${step-1}"`);
  const right = step===3 ? button('Сохранить тренажёр','save-trainer','check','primary') : button(step===1?'К заданиям':'К предпросмотру','step','arrow','primary',`data-index="${step+1}"`);
  return `<div class="wizard"><div class="page-head"><div><h1 tabindex="-1">${draft.id?'Редактирование тренажёра':'Новый тренажёр'}</h1><p>Настройте формат, добавьте задания и проверьте результат.</p></div></div>${steps}${content}${error ? `<div class="error" tabindex="-1" role="alert">${escape(error)}</div>`:''}<div class="footer-actions">${left}${right}</div></div>`;
}
function keyText(q) {
  if (isChoice(q.type)) return (q.type==='choice'?q.answer:[q.answer]).map(i=>q.options[i]).join(' · ');
  if (q.type==='match') return q.pairs.map(([left,right])=>`${left} → ${right}`).join(' · ');
  if (q.type==='drag') return q.order.join(' → ');
  return q.blanks.map(row=>row.join(' / ')).join(' · ');
}
function keyList(questions) {
  return `<div class="key-list">${questions.map((q,i)=>`<div class="key-row"><strong>${i+1}. ${escape(q.text)}</strong><span>${escape(keyText(q))} · ${pointLabel(q.points)}</span>${q.explanation?`<span>${escape(q.explanation)}</span>`:''}</div>`).join('')}</div>`;
}

function normalize(value) { return trim(value).normalize('NFC').toLocaleLowerCase('ru-RU').replace(/\s+/g,' '); }
function shuffle(items) {
  const result=[...items];
  for (let i=result.length-1;i>0;i--) { const j=Math.floor(Math.random()*(i+1)); [result[i],result[j]]=[result[j],result[i]]; }
  if (result.length>1 && result.every((value,i)=>value===items[i])) result.push(result.shift());
  return result;
}
function answerCorrect(q, answer) {
  if (q.type==='test' || q.type==='game') return answer===q.answer;
  if (q.type==='choice') return new Set(q.answer).size===answer.length && answer.every(i=>q.answer.includes(i));
  if (q.type==='match') return q.pairs.every((pair,i)=>q.pairs[answer[i]]?.[1]===pair[1]);
  if (q.type==='drag') return q.order.every((_,i)=>answer[i]===i);
  return q.blanks.every((row,i)=>row.some(value=>normalize(answer[i])===normalize(value)));
}
function play(item, origin, indices = item.questions.map((_,i)=>i), retry = false) {
  playerOrigin=origin;
  player={ item, indices, retry, position:0, history:[], streak:0, best:0 };
  resetAnswer();
  openView('player');
}
const currentQuestion = () => player.item.questions[player.indices[player.position]];
function resetAnswer() {
  const q=currentQuestion();
  player.checked=false;
  player.hint=false;
  player.message='';
  player.answer=q.type==='match'?Array(q.pairs.length).fill(-1):q.type==='fill'?Array(q.blanks.length).fill(''):['choice','drag'].includes(q.type)?[]:-1;
  const matchIndices = q.type==='match' ? Array.from(new Map(q.pairs.map((pair,i)=>[pair[1],i])).values()) : [];
  player.bank=q.type==='match'?shuffle(matchIndices):q.type==='drag'?shuffle(q.order.map((_,i)=>i)):[];
  dragIndex=null;
}
function enough(q, value) {
  if (q.type==='test'||q.type==='game') return value>=0;
  if (q.type==='choice') return value.length>0;
  if (q.type==='match') return value.every(i=>i>=0);
  if (q.type==='drag') return value.length===q.order.length;
  return value.every(item=>Boolean(trim(item)));
}
function playerAnswer(q) {
  const answer=player.answer;
  const disabled=player.checked?'disabled':'';
  if (isChoice(q.type)) return `<div class="answer-stack">${q.options.map((value,i)=>`<label class="answer-option"><input type="${q.type==='choice'?'checkbox':'radio'}" data-play="choice" name="play-choice" value="${i}" ${(q.type==='choice'?answer.includes(i):answer===i)?'checked':''} ${disabled}><span>${escape(value)}</span></label>`).join('')}</div>`;
  if (q.type==='match') return `<div>${q.pairs.map(([left],i)=>`<label class="match-row"><span>${escape(left)}</span><select class="inline-input" data-play="match" data-index="${i}" ${disabled}>${selection(player.bank.map(index=>[String(index),q.pairs[index][1]]),String(answer[i]),'Выбрать соответствие')}</select></label>`).join('')}</div>`;
  if (q.type==='drag') {
    const piece = (index, placed, position) => `<div class="order-row" draggable="${!player.checked}" data-drag="${index}">${button(escape(q.order[index]),placed?'order-remove':'order-add','move','',`data-index="${index}" ${disabled} ${placed?'title="Вернуть в список"':''}`)}${placed&&!player.checked?iconButton('Выше','order-up','up',`data-index="${index}" ${position===0?'disabled':''}`)+iconButton('Ниже','order-down','down',`data-index="${index}" ${position===answer.length-1?'disabled':''}`):''}</div>`;
    return `<p class="muted">Перетащите элементы в нужном порядке или нажмите на них. Стрелки меняют порядок.</p><div class="order-heading">Элементы</div><div class="order-bank" data-drop="bank">${player.bank.filter(i=>!answer.includes(i)).map(i=>piece(i,false,-1)).join('') || '<span class="muted">Все элементы размещены.</span>'}</div><div class="order-heading">Ваш порядок</div><div class="drop-zone" data-drop="answer">${answer.map((i,position)=>piece(i,true,position)).join('') || '<span class="muted">Переместите сюда первый элемент.</span>'}</div>`;
  }
  return `<div class="fill-body">${q.pattern.split('___').map((part,i)=>`${i?`<input class="inline-input" data-play="fill" data-index="${i-1}" aria-label="Пропуск ${i}" value="${escape(answer[i-1])}" maxlength="400" autocapitalize="off" autocomplete="off" spellcheck="false" ${disabled}>`:''}${escape(part)}`).join('')}</div>`;
}

}
function renderPlayer() {
  if (player.position>=player.indices.length) return renderResult();
  const q=currentQuestion();
  const latest=player.checked?player.history.at(-1):null;
  const hasGame=player.item.type==='game'||q.type==='game';
  return `<div class="player-wrap">${playerHeader()}<div class="progress-line"><span>Задание ${player.position+1} из ${player.indices.length}</span><span>${hasGame?`Серия верных ответов · ${player.streak}`:pointLabel(q.points)}</span></div><div class="progress-track" role="progressbar" aria-label="Прогресс" aria-valuenow="${player.position+(player.checked?1:0)}" aria-valuemax="${player.indices.length}"><span style="width:${(player.position+(player.checked?1:0))/player.indices.length*100}%"></span></div>
  <section class="panel"><h2 class="question-text">${escape(q.text)}</h2>${playerAnswer(q)}${player.hint?`<div class="feedback"><strong>Подсказка</strong><p>${escape(q.hint)}</p></div>`:''}${player.message?`<p class="error" role="alert">${escape(player.message)}</p>`:''}${latest?`<div class="feedback ${latest.correct?'':'wrong'}" role="status"><strong>${latest.correct?'Верно!':'Есть ошибка'}</strong>${latest.correct && q.explanation?`<p>${escape(q.explanation)}</p>`:''}</div>`:''}
  <div class="actions details-actions">${latest?button(player.position+1===player.indices.length?'К результату':'Следующее задание','next-answer','arrow','primary'):button('Проверить ответ','check-answer','check','primary')}${q.hint&&!player.hint&&!latest?button('Подсказка','hint','bulb'):''}</div></section></div>`;
}
function responseText(q, answer) {
  if (q.type==='test' || q.type==='game') return q.options[answer];
  if (q.type==='choice') return answer.map(i=>q.options[i]).join(' · ');
  if (q.type==='match') return q.pairs.map(([left],i)=>`${left} → ${q.pairs[answer[i]][1]}`).join(' · ');
  if (q.type==='drag') return answer.map(i=>q.order[i]).join(' → ');
  return answer.map(value=>trim(value)).join(' · ');
}
function renderResultEntry(entry) {
  const q=player.item.questions[entry.index];
  const question=escape(q.text);
  if (entry.correct) return `<li>${icon('check')}<span><strong class="sr-only">Верно. </strong>${question}</span></li>`;
  return `<li class="wrong">${icon('x')}<details><summary><span class="sr-only">Ошибка. </span>${question}</summary>
    <dl class="answer-review"><dt>Ваш ответ</dt><dd>${escape(entry.response)}</dd><dt>Правильный ответ</dt><dd>${escape(keyText(q))}</dd>${trim(q.explanation)?`<dt>Пояснение</dt><dd>${escape(q.explanation)}</dd>`:''}</dl></details></li>`;
}
function renderResult() {
  const errors=player.history.filter(entry=>!entry.correct);
  const total=player.history.reduce((n,entry)=>n+entry.points,0);
  const maximum=player.indices.reduce((n,i)=>n+player.item.questions[i].points,0);
  return `<div class="player-wrap">${playerHeader()}<section class="panel"><h2>Результат</h2><div class="result-score"><span class="score-circle">${Math.round(total/maximum*100)}%</span><div><strong>${pointLabel(total)} из ${maximum}</strong><p class="muted">Верных ответов: ${player.history.length-errors.length} из ${player.history.length}</p>${player.item.questions.some(q=>q.type==='game')?`<p class="muted">Лучшая серия · ${player.best}</p>`:''}</div></div>${player.item.criteria?`<p class="muted">${escape(player.item.criteria)}</p>`:''}
  ${errors.length?'<p class="muted">Нажмите на задание с ошибкой, чтобы сравнить ответы.</p>':''}<ul class="result-list">${player.history.map(renderResultEntry).join('')}</ul><div class="actions">${errors.length?button('Повторить ошибки','retry','reset','primary'):''}${button('Пройти заново','restart','arrow',errors.length?'':'primary')}</div></section></div>`;
}
function assess() {
  if (player.checked) return;
  const q=currentQuestion();
  if (!enough(q,player.answer)) { player.message='Сначала заполните ответ.'; return render(); }
  player.message='';
  const correct=answerCorrect(q,player.answer);
  player.history.push({ index:player.indices[player.position], correct, points:correct?q.points:0, response:correct?'':responseText(q,player.answer) });
  player.streak=correct?player.streak+1:0;
  player.best=Math.max(player.best,player.streak);
  player.checked=true;
  render();
  root.querySelector('[data-action="next-answer"]')?.focus({preventScroll:true});
}
function movePiece(index, target, bank = false) {
  if (player.checked || !player.bank.includes(index)) return;
  const answer=player.answer.filter(i=>i!==index);
  if (!bank) { const pos=target===null?answer.length:answer.indexOf(target); answer.splice(pos<0?answer.length:pos,0,index); }
  player.answer=answer;
  player.message='';
  render();
}
function changeOrder(index, offset) {
  const values=player.answer;
  const from=values.indexOf(index);
  const to=from+offset;
  if (player.checked || from<0 || to<0 || to>=values.length) return;
  [values[from],values[to]]=[values[to],values[from]];
  render();
  root.querySelector(`[data-action="order-${offset<0?'up':'down'}"][data-index="${index}"]:not(:disabled)`)?.focus();
}

function currentDraft() {
  return { ...draft, id:draft.id ?? identifier(), title:trim(draft.title), topic:trim(draft.topic), questions:draft.questions.map(questionFromEditor) };
}
function storeTrainer() {
  const item=currentDraft();
  db.items=[item,...db.items.filter(x=>x.id!==item.id)];
  draft=null;
  db.draft=null;
  activeItem=item;
  const saved=saveLocal();
  openView('detail');
  toast(saved?'Тренажёр сохранён.':'Тренажёр открыт. Хранилище браузера недоступно, скачайте резервную копию.',!saved);
}
function storeTemplate() {
  if (!commitCount()) return;
  const message=metaProblem();
  if (message) { step=1; return wizardError(message); }
  const template={ ...canonicalTrainer({...draft,questions:[]}), id:identifier(), count:draft.questions.length };
  db.templates.unshift(template);
  const saved=saveLocal();
  toast(saved?'Шаблон сохранён.':'Шаблон добавлен на время сеанса. Скачайте резервную копию.',!saved);
}
function downloadBlob(blob, filename) {
  const href=URL.createObjectURL(blob);
  const link=document.createElement('a');
  link.href=href;
  link.download=filename;
  document.body.append(link);
  link.click();
  link.remove();
  setTimeout(()=>URL.revokeObjectURL(href),60000);
}
function standalone(payload) {
  const page=document.documentElement.cloneNode(true);
  page.querySelector('#app').textContent='';
  page.querySelector('#notice').textContent='';
  page.querySelector('#notice').hidden=true;
  page.querySelector('#dialog').textContent='';
  page.querySelector('#dialog').removeAttribute('open');
  page.querySelector('#offline-data').textContent=JSON.stringify(pack(payload));
  if (payload.mode==='student') page.querySelector('title').textContent=payload.item.title;
  return new Blob(['<!doctype html>\n',page.outerHTML],{type:'text/html;charset=utf-8'});
}
function shareableItem(item) {
  return canonicalTrainer(item);
}
function workspaceSnapshot() { return { items:db.items, templates:db.templates, draft }; }
function offlineDialog(isStudent) {
  dialog(isStudent?'Автономный тренажёр':'Автономный конструктор',`<p>${isStudent?'Скачайте HTML и передайте файл ученикам. Проверка работает без интернета в браузере.':'Скачайте HTML с текущими тренажёрами, шаблонами и черновиком. Откройте файл в браузере для работы без интернета.'}</p><div class="actions">${button('Скачать HTML',isStudent?'download-student':'download-teacher','download','primary')}${button('Открыть в браузере',isStudent?'open-student-offline':'open-teacher-offline','external')}${button('Закрыть','close-dialog',null,'quiet')}</div>`);
}
function makeOffline(isStudent, open) {
  const payload=isStudent ? { mode:'student', item:shareableItem(activeItem) } : { mode:'teacher', workspace:workspaceSnapshot() };
  const blob=standalone(payload);
  if (!open) { downloadBlob(blob,isStudent?'Trenazher_uchenika.html':'Konstruktor_trenazherov.html'); toast('HTML подготовлен к скачиванию.'); return; }
  const url=URL.createObjectURL(blob);
  const link=document.createElement('a');
  link.href=url;
  link.target='_blank';
  link.rel='noopener';
  document.body.append(link);
  link.click();
  link.remove();
  setTimeout(()=>URL.revokeObjectURL(url),60000);
}
async function share() {
  if (!['http:','https:'].includes(location.protocol)) {
    toast('Из локального файла поделитесь ученической HTML-версией.',true);
    return offlineDialog(true);
  }
  const url=siteVisits ? new URL(pagesUrl) : new URL(location.pathname,location.origin);
  url.hash=`student=${pack(shareableItem(activeItem))}`;
  if (url.href.length>24000) { toast('Для этого объёма задания используйте HTML-файл.',true); return offlineDialog(true); }
  const info='Отправьте эту ссылку ученикам. Для работы без интернета скачайте ученический HTML-файл.';
  try { await navigator.clipboard.writeText(url.href); toast('Ссылка скопирована.'); } catch { /* The text field supports manual copying. */ }
  dialog('Ссылка на режим ученика',`<p>${info}</p><label class="field"><span>Ссылка</span><input readonly value="${escape(url.href)}" data-share-url></label><div class="actions">${button('Выделить ссылку','select-link','copy')}${button('Скачать HTML для ученика','download-student','download')}${button('Закрыть','close-dialog',null,'quiet')}</div>`);
}
function openItem(id) {
  activeItem=[...db.items,...samples].find(item=>item.id===id);
  if (activeItem) openView('detail');
}
function setOptionAnswer(index, checked) {
  const q=draft.questions[questionIndex];
  if (q.type==='choice') q.answer=checked?[...new Set([...list(q.answer),index])]:list(q.answer).filter(i=>i!==index);
  else if (checked) q.answer=index;
}
function removeOption(index) {
  const q=draft.questions[questionIndex];
  if (q.options.length<=2) return;
  q.options.splice(index,1);
  if (q.type==='choice') q.answer=list(q.answer).filter(i=>i!==index).map(i=>i>index?i-1:i);
  else if (q.answer>=index) q.answer=q.answer===index?-1:q.answer-1;
  rememberDraft();
  render();
}
function changeQuestionType(q,type) {
  if (q.type===type) return;
  if (!q.options.length) q.options=['','',''];
  if (type==='choice' && !Array.isArray(q.answer)) q.answer=q.answer>=0?[q.answer]:[];
  if (type!=='choice' && Array.isArray(q.answer)) q.answer=q.answer.length===1?q.answer[0]:-1;
  q.type=type;
}
function deleteItem(id,isTemplate) {
  const key=isTemplate?'templates':'items';
  const item=db[key].find(x=>x.id===id);
  if (!item) return;
  dialog(isTemplate?'Удалить шаблон?':'Удалить тренажёр?',`<p>${escape(item.title)}</p><div class="actions">${button('Удалить','confirm-remove','trash','danger')}${button('Отмена','close-dialog')}</div>`);
  modal.querySelector('[data-action="confirm-remove"]').addEventListener('click',()=>{
    db[key]=db[key].filter(x=>x.id!==id);
    if (!isTemplate && draft?.id===id) { draft=null; db.draft=null; }
    saveLocal(); modal.close(); openView(isTemplate?'templates':'library');
    toast(isTemplate?'Шаблон удалён.':'Тренажёр удалён.');
  },{once:true});
}
function appendQuestion() {
  if (draft.questions.length>=100) return;
  draft.questions.push(blankQuestion(draft.type));
  questionIndex=draft.questions.length-1;
  rememberDraft(); render();
  root.querySelector('[data-question="text"]')?.focus();
}
function removeQuestion() {
  if (draft.questions.length<=1) return;
  const remove=()=>{
    draft.questions.splice(questionIndex,1);
    questionIndex=Math.min(questionIndex,draft.questions.length-1);
    rememberDraft(); render();
  };
  if (!trim(draft.questions[questionIndex].text)) return remove();
  dialog(`Удалить задание ${questionIndex+1}?`,`<div class="actions">${button('Удалить','confirm-remove','trash','danger')}${button('Отмена','close-dialog')}</div>`);
  modal.querySelector('[data-action="confirm-remove"]').addEventListener('click',()=>{modal.close();remove();},{once:true});
}
function commitCount() {
  const el=root.querySelector('[data-meta="count"]');
  if (!el) return true;
  const count=Number(el.value);
  if (!Number.isInteger(count) || count<1 || count>100) {
    wizardError('Укажите количество заданий от 1 до 100.');
    return false;
  }
  if (count===draft.questions.length) return true;
  const apply=()=>{
    if (count<draft.questions.length) draft.questions.length=count;
    else while (draft.questions.length<count) draft.questions.push(blankQuestion(draft.type));
    questionIndex=Math.min(questionIndex,count-1);
    rememberDraft();
  };
  if (!draft.questions.slice(count).some(q=>trim(q.text))) {apply();return true;}
  el.value=draft.questions.length;
  dialog('Уменьшить количество заданий?',`<p>С конца списка будут удалены задания ${count+1}–${draft.questions.length}.</p><div class="actions">${button('Удалить задания','confirm-remove','trash','danger')}${button('Отмена','close-dialog')}</div>`);
  modal.querySelector('[data-action="confirm-remove"]').addEventListener('click',()=>{modal.close();apply();render();},{once:true});
  return false;
}
async function importWorkspace(file) {
  if (!file) return;
  try {
    const incoming=storageData(JSON.parse(await file.text()));
    function merge(current, additions) {
      const ids=new Set(current.map(item=>item.id));
      for (const item of additions) {
        const existing=current.find(x=>x.id===item.id);
        if (existing && JSON.stringify(existing)===JSON.stringify(item)) continue;
        if (ids.has(item.id)) item.id=identifier();
        ids.add(item.id); current.push(item);
      }
    }
    merge(db.items,incoming.items);
    merge(db.templates,incoming.templates);
    if (!draft && incoming.draft) { draft=incoming.draft; db.draft=draft; }
    const saved=saveLocal();
    render(); toast(saved?'Резервная копия импортирована.':'Данные импортированы на время сеанса.',!saved);
  } catch { toast('Не удалось прочитать файл. Выберите резервную копию конструктора.',true); }
}
const actions = {
  library:()=>openView('library'), templates:()=>openView('templates'),
  stats:()=>{if(onlineVisits){openView('stats');refreshStats();}}, 'refresh-stats':refreshStats,
  constructor:()=>{ if (draft) openView('wizard'); else newDraft(); },
  new:()=>requestDraft(), resume:()=>{modal.close();openView('wizard');},
  tab:el=>{tab=el.dataset.value;render();root.querySelector(`[data-action="tab"][data-value="${tab}"]`)?.focus();},
  'reset-filters':()=>{filters=blankFilters();render();root.querySelector('[data-filter="grade"]')?.focus();},
  detail:el=>openItem(el.dataset.id),
  step:el=>changeStep(Number(el.dataset.index)),
  'choose-format':el=>{
    if (!commitCount()) return;
    const type=el.dataset.value;
    for (const q of draft.questions) if (!trim(q.text) && q.type===draft.type) changeQuestionType(q,type);
    draft.type=type; rememberDraft(); render(); root.querySelector(`.format[data-value="${type}"]`)?.focus();
  },
  'select-question':el=>{questionIndex=Number(el.dataset.index);error='';render();root.querySelector('[data-question="text"]')?.focus();},
  'add-question':appendQuestion, 'remove-question':removeQuestion,
  'add-option':()=>{const options=draft.questions[questionIndex].options;if(options.length<12){options.push('');rememberDraft();render();root.querySelector(`[data-option="${options.length-1}"]`)?.focus();}},
  'remove-option':el=>removeOption(Number(el.dataset.index)),
  'save-trainer':storeTrainer, 'save-template':storeTemplate,
  'use-template':el=>{const item=db.templates.find(x=>x.id===el.dataset.id);if(item)requestDraft(item);},
  'remove-template':el=>deleteItem(el.dataset.id,true), 'remove-trainer':()=>deleteItem(activeItem.id,false),
  'edit-item':()=>requestDraft(activeItem,true), duplicate:()=>requestDraft(activeItem),
  preview:()=>play(currentDraft(),'wizard'), play:()=>play(activeItem,'detail'),
  'leave-player':()=>openView(playerOrigin), hint:()=>{player.hint=true;render();root.querySelector('[data-action="check-answer"]')?.focus({preventScroll:true});},
  'check-answer':assess,
  'next-answer':()=>{player.position++;if(player.position<player.indices.length)resetAnswer();openView('player');},
  retry:()=>play(player.item,playerOrigin,player.history.filter(x=>!x.correct).map(x=>x.index),true),
  restart:()=>play(player.item,playerOrigin),
  'order-add':el=>{movePiece(Number(el.dataset.index),null);root.querySelector('[data-action="order-add"]:not(:disabled),[data-action="check-answer"]')?.focus({preventScroll:true});},
  'order-remove':el=>movePiece(Number(el.dataset.index),null,true),
  'order-up':el=>changeOrder(Number(el.dataset.index),-1), 'order-down':el=>changeOrder(Number(el.dataset.index),1),
  offline:()=>offlineDialog(false), 'student-offline':()=>offlineDialog(true),
  'download-teacher':()=>makeOffline(false,false), 'download-student':()=>makeOffline(true,false),
  'open-teacher-offline':()=>makeOffline(false,true), 'open-student-offline':()=>makeOffline(true,true),
  'close-dialog':()=>modal.close(), share,
  'select-link':()=>{const el=modal.querySelector('[data-share-url]');el.focus();el.select();},
  backup:()=>downloadBlob(new Blob([JSON.stringify(workspaceSnapshot(),null,2)],{type:'application/json'}),'Trenazhery_rezervnaya_kopiya.json'),
  import:()=>root.querySelector('#import-file')?.click()
};
document.addEventListener('click',event=>{
  const el=event.target.closest('[data-action]');
  if (el && !el.disabled && Object.hasOwn(actions,el.dataset.action)) actions[el.dataset.action](el);
});
root.addEventListener('input',event=>{
  const el=event.target;
  const data=el.dataset;
  if (data.filter!==undefined) {filters[data.filter]=el.value;root.querySelector('#library-items').innerHTML=renderCards();}
  if (data.meta!==undefined && data.meta!=='count') {draft[data.meta]=el.value;rememberDraft();}
  if (data.question!==undefined && data.question!=='type') {draft.questions[questionIndex][data.question]=el.value;rememberDraft();}
  if (data.option!==undefined) {draft.questions[questionIndex].options[Number(data.option)]=el.value;rememberDraft();}
  if (data.play==='fill') {player.answer[Number(data.index)]=el.value;player.message='';}
});
root.addEventListener('change',event=>{
  const el=event.target;
  const data=el.dataset;
  if (el.id==='import-file') importWorkspace(el.files[0]);
  if (data.question==='type') {changeQuestionType(draft.questions[questionIndex],el.value);rememberDraft();render();root.querySelector('[data-question="type"]')?.focus();}
  if (data.answer!==undefined) {setOptionAnswer(Number(data.answer),el.checked);rememberDraft();}
  if (data.play==='choice') {
    const value=Number(el.value);
    player.answer=currentQuestion().type==='choice'?(el.checked?[...player.answer,value]:player.answer.filter(i=>i!==value)):value;
    player.message='';
  }
  if (data.play==='match') {player.answer[Number(data.index)]=el.value===''?-1:Number(el.value);player.message='';}
});
root.addEventListener('dragstart',event=>{
  const el=event.target.closest('[data-drag]');
  if (!el || !player || player.checked) return;
  dragIndex=Number(el.dataset.drag);
  event.dataTransfer.setData('text/plain',String(dragIndex));
  event.dataTransfer.effectAllowed='move';
});
root.addEventListener('dragover',event=>{
  if (dragIndex!==null && event.target.closest('[data-drop]')) {event.preventDefault();event.dataTransfer.dropEffect='move';}
});
root.addEventListener('drop',event=>{
  const zone=event.target.closest('[data-drop]');
  if (dragIndex===null || !zone) return;
  event.preventDefault();
  const tile=event.target.closest('[data-drag]');
  const target=tile?Number(tile.dataset.drag):null;
  if (target!==dragIndex) movePiece(dragIndex,target,zone.dataset.drop==='bank');
  dragIndex=null;
});
root.addEventListener('dragend',()=>{dragIndex=null;});
function start() {
  const isLink=location.hash.startsWith('#student=');
  if (!isLink && offline?.mode!=='student') { render(); return; }
  studentOnly=true;
  try {
    const item=canonicalTrainer(isLink?unpack(location.hash.slice(9)):offline.item);
    if (!item.questions.length || !trim(item.title) || item.questions.some(problem)) throw new Error('Invalid exercise');
    play(item,'shared');
  } catch { openView('invalid'); }
}
window.addEventListener('hashchange',()=>{if (location.hash.startsWith('#student=')) start();else if (!offline && studentOnly) {studentOnly=false;openView('library');}});
start();
registerVisit();

async function pagesCount(action, key) {
  const response = await fetch(`${pagesCounter}${action}/${key}`, { cache: 'no-store', credentials: 'omit', referrerPolicy: 'no-referrer' });
  if (response.status === 404 && action === 'get') return 0;
  if (!response.ok) throw new Error('Visit statistics unavailable');
  const data = await response.json();
  if (!Number.isSafeInteger(data.value) || data.value < 0) throw new Error('Invalid statistics');
  return data.value;
}

async function recordPagesVisit() {
  const today = moscowDay.format(new Date());
  const record = async (localKey, expected, counterKey) => {
    if (localStorage.getItem(localKey) === expected) return;
    await pagesCount('hit', counterKey);
    localStorage.setItem(localKey, expected);
  };
  const track = () => Promise.allSettled([
    record(`${pagesCounterKey}-total`, '1', pagesCounterKey),
    record(`${pagesCounterKey}-day`, today, `${pagesCounterKey}-${today}`)
  ]);
  return navigator.locks ? navigator.locks.request(pagesCounterKey, track) : track();
}

function registerVisit() {
  if (pagesVisits) {
    visitRegistration = recordPagesVisit().catch(() => {});
    return;
  }
  if (!siteVisits) return;
  try {
    const key = 'teacher-trainer-visitor-v1';
    let visitor = localStorage.getItem(key);
    if (!visitor) {
      visitor = crypto.randomUUID();
      localStorage.setItem(key, visitor);
    }
    visitRegistration = fetch('/api/visits', { method: 'POST', body: visitor, keepalive: true, credentials: 'omit' }).catch(() => {});
  } catch {
    // The app remains usable when the browser disables local storage.
  }
}

function renderStats() {
  return `<div class="page-head"><div><h1 tabindex="-1">Посещаемость</h1><p>Сколько браузеров открыли конструктор или ученическую ссылку.</p></div>${button('Обновить','refresh-stats','reset')}</div>
  <section class="panel"><div id="visitor-stats" role="status" aria-live="polite"><p class="muted">Загружаю данные…</p></div><p class="muted">Повторные открытия из одного браузера считаются один раз. Другой браузер или очистка его данных могут изменить подсчёт. День считается по московскому времени.${pagesVisits?' Здесь учитываются только открытия версии на GitHub Pages.':''}</p></section>`;
}

async function refreshStats() {
  const target = root.querySelector('#visitor-stats');
  if (!target) return;
  const request = ++statsRequest;
  target.setAttribute('aria-busy','true');
  try {
    if (visitRegistration) await visitRegistration;
    let data;
    if (pagesVisits) {
      const [total,today] = await Promise.all([
        pagesCount('get',pagesCounterKey),
        pagesCount('get',`${pagesCounterKey}-${moscowDay.format(new Date())}`)
      ]);
      data = { total, today };
    } else {
      const response = await fetch('/api/visits', { cache: 'no-store', credentials: 'omit' });
      if (!response.ok) throw new Error('Visit statistics unavailable');
      data = await response.json();
    }
    if (![data.today, data.total].every(number => Number.isSafeInteger(number) && number >= 0)) throw new Error('Invalid statistics');
    if (request === statsRequest) target.innerHTML = `<div class="visit-metrics">${[[data.total,'Всего с момента включения счётчика'],[data.today,'Сегодня']].map(([value,label])=>`<div><strong>${value.toLocaleString('ru-RU')}</strong><span>${label}</span></div>`).join('')}</div>`;
  } catch {
    if (request === statsRequest) target.innerHTML = '<p class="error">Статистика временно недоступна. Попробуйте обновить.</p>';
  } finally {
    if (request === statsRequest) target.removeAttribute('aria-busy');
  }
}
